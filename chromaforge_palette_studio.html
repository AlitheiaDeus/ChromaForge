      // Map slots 0..10 to the 11 anatomical/stylistic zones with fallback tones if N < 11
      const fallbackColors = [
        "#CBD5E1", "#38BDF8", "#0F172A", "#38BDF8", "#0F172A",
        "#F43F5E", "#94A3B8", "#334155", "#1E293B", "#F59E0B", "#161922"
      ];
      const z = {};
      CREATURE_ZONES.forEach((zone, idx) => {
        z[zone.key] = idx < n ? slots[idx].hex : fallbackColors[idx];
      });

      const layout = document.createElement("div");
      layout.className = "w-full h-full grid grid-cols-1 lg:grid-cols-12 overflow-y-auto";

      // Left / Main Character Stage (7 cols)
      const stageCol = document.createElement("div");
      stageCol.style.background = `radial-gradient(circle at 50% 45%, ${hexWithAlpha(z.aura, 0.35)} 0%, #111216 74%)`;
      stageCol.className = "lg:col-span-7 relative flex flex-col items-center justify-center p-4 min-h-[380px] border-b lg:border-b-0 lg:border-r border-studio-border";

      // Archetype Selector Pill at top of Creature Stage
      const archBar = document.createElement("div");
      archBar.className = "bg-studio-panel/90 backdrop-blur border border-studio-border rounded-full p-1 flex items-center gap-1 z-20 mb-2";
      const archetypes = [
        { id: "nomad", label: "Cyber-Nomad" },
        { id: "fox", label: "Arcane Fox-Kin" },
        { id: "valkyrie", label: "Mecha-Valkyrie" }
      ];
      archetypes.forEach(a => {
        const b = document.createElement("button");
        b.className = `px-3 py-1 rounded-full text-xs font-medium transition cursor-pointer ${
          state.creatureArchetype === a.id ? "bg-white text-studio-bg" : "text-studio-muted hover:text-white"
        }`;
        b.textContent = a.label;
        b.onclick = () => { state.creatureArchetype = a.id; renderAll(); };
        archBar.appendChild(b);
      });
      stageCol.appendChild(archBar);

      // Stylized Humanoid Silhouette Vector SVG
      const svgWrap = document.createElement("div");
      svgWrap.className = "relative w-full max-w-[380px] aspect-[4/4.4] flex items-center justify-center";

      const crestSVG = state.creatureArchetype === "fox"
        ? `<!-- Tall Fox Ears & Mane -->
           <path d="M138 118 L112 36 L168 88 Z" fill="${z.hair}" stroke="#111216" stroke-width="2.5"/>
           <path d="M136 105 L122 55 L156 88 Z" fill="${z.accent}" opacity="0.85"/>
           <path d="M262 118 L288 36 L232 88 Z" fill="${z.hair}" stroke="#111216" stroke-width="2.5"/>
           <path d="M264 105 L278 55 L244 88 Z" fill="${z.accent}" opacity="0.85"/>
           <path d="M132 135 Q200 62 268 135 Q278 180 256 205 Q200 120 144 205 Q122 180 132 135 Z" fill="${z.hair}" stroke="#111216" stroke-width="2.5"/>`
        : state.creatureArchetype === "valkyrie"
        ? `<!-- Winged Helm Crest -->
           <path d="M136 122 L84 68 L122 116 L94 114 L134 146 Z" fill="${z.hair}" stroke="#111216" stroke-width="2.5"/>
           <path d="M264 122 L316 68 L278 116 L306 114 L266 146 Z" fill="${z.hair}" stroke="#111216" stroke-width="2.5"/>
           <path d="M142 124 Q200 65 258 124 L250 145 L200 112 L150 145 Z" fill="${z.hair}" stroke="#111216" stroke-width="2.5"/>
           <polygon points="200,56 212,95 200,112 188,95" fill="${z.accent}"/>`
        : `<!-- Cyber-Nomad Swept Hair & Hood Silhouette -->
           <path d="M126 145 Q134 72 200 72 Q266 72 274 145 Q282 195 255 215 L145 215 Q118 195 126 145 Z" fill="${z.hair}" stroke="#111216" stroke-width="2.5"/>
           <path d="M142 128 Q175 92 224 104 Q248 112 258 136 Q215 116 175 134 Q154 142 142 128 Z" fill="${z.accent}" opacity="0.9"/>`;

      svgWrap.innerHTML = `
        <svg viewBox="0 0 400 440" class="w-full h-full drop-shadow-2xl overflow-visible">
          <!-- Aura Ring -->
          <circle cx="200" cy="215" r="165" fill="none" stroke="${z.aura}" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75"/>
          <circle cx="200" cy="215" r="142" fill="${z.aura}" opacity="0.18"/>

          <!-- Back Cloak / Mantle -->
          <path d="M110 235 Q85 330 74 415 L326 415 Q315 330 290 235 Z" fill="${z.outfit}" stroke="#111216" stroke-width="3"/>

          <!-- Neck & Shoulders (Skin) -->
          <path d="M176 195 L224 195 L232 238 L168 238 Z" fill="${z.skin}" stroke="#111216" stroke-width="2.5"/>
          <path d="M122 248 Q155 224 200 224 Q245 224 278 248 L296 365 L262 372 L248 290 L248 415 L152 415 L152 290 L138 372 L104 365 Z" fill="${z.skin}" stroke="#111216" stroke-width="2.5"/>

          <!-- Outfit Tunic / Armor Plates -->
          <path d="M144 236 L200 264 L256 236 L268 415 L132 415 Z" fill="${z.outfit}" stroke="#111216" stroke-width="2.5"/>
          <!-- Outfit Accent Trim -->
          <path d="M156 244 L200 278 L244 244 L236 262 L200 292 L164 262 Z" fill="${z.accent}"/>
          <path d="M194 290 L206 290 L206 415 L194 415 Z" fill="${z.accent}" opacity="0.85"/>

          <!-- Accessories: Belt, Buckle, Shoulder Clasps & Floating Charm -->
          <rect x="142" y="324" width="116" height="14" rx="4" fill="${z.accessories}" stroke="#111216" stroke-width="2"/>
          <circle cx="200" cy="331" r="11" fill="${z.accent}" stroke="${z.accessories}" stroke-width="3"/>
          <circle cx="145" cy="252" r="9" fill="${z.accessories}" stroke="#111216" stroke-width="2"/>
          <circle cx="255" cy="252" r="9" fill="${z.accessories}" stroke="#111216" stroke-width="2"/>
          <polygon points="325,165 338,185 325,205 312,185" fill="${z.accessories}" stroke="#111216" stroke-width="2"/>

          <!-- Head Silhouette (Skin) -->
          <path d="M146 135 Q146 92 200 92 Q254 92 254 135 Q254 188 200 205 Q146 188 146 135 Z" fill="${z.skin}" stroke="#111216" stroke-width="2.5"/>

          <!-- Cheek / Brow Markings (Primary Accent) -->
          <path d="M153 162 L168 167 L156 172 Z" fill="${z.accent}"/>
          <path d="M247 162 L232 167 L244 172 Z" fill="${z.accent}"/>

          <!-- Hair / Crest -->
          ${crestSVG}

          <!-- Left Eye (eyeoutL & eyeinL) -->
          <ellipse cx="175" cy="148" rx="14" ry="10" fill="${z.eyeoutL}" stroke="#111216" stroke-width="2"/>
          <circle cx="176" cy="148" r="5.5" fill="${z.eyeinL}"/>
          <circle cx="174" cy="146" r="1.8" fill="#FFFFFF" opacity="0.85"/>

          <!-- Right Eye (eyeoutR & eyeinR) -->
          <ellipse cx="225" cy="148" rx="14" ry="10" fill="${z.eyeoutR}" stroke="#111216" stroke-width="2"/>
          <circle cx="224" cy="148" r="5.5" fill="${z.eyeinR}"/>
          <circle cx="222" cy="146" r="1.8" fill="#FFFFFF" opacity="0.85"/>

          <!-- Mouth -->
          <path d="M188 180 Q200 187 212 180" fill="none" stroke="${z.mouth}" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
      `;

      // If N > 11, render extra colors 12..N as floating Spirit Orbs around the creature
      if (n > 11) {
        const orbCoords = [
          { top: "14%", left: "10%" }, { top: "14%", right: "10%" },
          { top: "36%", left: "6%" }, { top: "36%", right: "6%" },
          { top: "60%", left: "8%" }, { top: "60%", right: "8%" },
          { top: "82%", left: "14%" }, { top: "82%", right: "14%" },
          { top: "6%", left: "32%" }, { top: "6%", right: "32%" },
          { top: "88%", left: "34%" }, { top: "88%", right: "34%" },
          { top: "48%", left: "2%" }
        ];
        for (let i = 11; i < n; i++) {
          const pos = orbCoords[(i - 11) % orbCoords.length];
          const hex = slots[i].hex;
          const orb = document.createElement("button");
          orb.style.backgroundColor = hex;
          orb.style.color = getContrastText(hex);
          orb.style.animationDelay = `${(i % 5) * 0.6}s`;
          Object.assign(orb.style, pos);
          orb.className = "animate-float absolute w-10 h-10 rounded-full border-2 border-white/25 shadow-lg flex items-center justify-center font-mono text-[10px] font-bold cursor-pointer hover:scale-110 transition";
          orb.textContent = `#${i + 1}`;
          orb.title = `Spirit Orb #${i + 1}: ${hex} (Click to edit)`;
          orb.onclick = () => openColorPopover(i, orb);
          stageCol.appendChild(orb);
        }
      }

      stageCol.appendChild(svgWrap);
      layout.appendChild(stageCol);

      // Right Zone Legend & Slot Mapper (5 cols)
      const legendCol = document.createElement("div");
      legendCol.className = "lg:col-span-5 p-4 flex flex-col gap-2.5 overflow-y-auto bg-studio-bg";

      const header = document.createElement("div");
      header.className = "flex items-center justify-between";
      header.innerHTML = `
        <div>
          <h3 class="text-xs font-semibold uppercase tracking-wider text-white">Character Zone Mapping (11 Zones)</h3>
          <p class="text-[11px] text-studio-muted">Drag or swap slots to re-assign anatomical colors</p>
        </div>
      `;
      legendCol.appendChild(header);

      const list = document.createElement("div");
      list.className = "space-y-1.5";

      CREATURE_ZONES.forEach((zone, idx) => {
        const hasSlot = idx < n;
        const hex = z[zone.key];
        const nameInfo = getClosestColorName(hex);

        const row = document.createElement("div");
        row.className = `flex items-center justify-between gap-2 px-3 py-2 rounded-xl border text-xs transition ${
          hasSlot
            ? "bg-studio-panel border-studio-border hover:border-white/25"
            : "bg-studio-panel/40 border-studio-border/50 opacity-70"
        }`;
        if (hasSlot) attachSlotDragHandlers(row, idx);

        const left = document.createElement("div");
        left.className = "flex items-center gap-2.5 min-w-0";
        left.innerHTML = `
          <span class="w-6 h-6 rounded-lg border border-white/20 shrink-0 shadow-inner cursor-pointer" style="background:${hex}" data-swatch-trigger="true"></span>
          <div class="min-w-0">
            <div class="font-medium text-white truncate">${idx + 1}. ${zone.label}</div>
            <div class="text-[11px] font-mono text-studio-muted truncate">${hex} · ${nameInfo.label}</div>
          </div>
        `;
        if (hasSlot) {
          left.querySelector("[data-swatch-trigger]").onclick = e => openColorPopover(idx, e.target);
        }

        row.appendChild(left);

        if (hasSlot) {
          row.appendChild(createSlotControlsBar(idx, "#F8FAFC", false));
        } else {
          const autoTag = document.createElement("span");
          autoTag.className = "text-[10px] font-mono text-studio-muted px-2 py-0.5 rounded bg-studio-bg";
          autoTag.textContent = "Fallback";
          row.appendChild(autoTag);
        }

        list.appendChild(row);
      });

      legendCol.appendChild(list);
      layout.appendChild(legendCol);
      container.appendChild(layout);
    }

    /**
     * =========================================================================
     * 16. PINNED SWATCHES BAR & PALETTE LIBRARY DRAWER
     * =========================================================================
     */
    function renderPinnedDock() {
      const list = document.getElementById("pinned-list");
      const countBadge = document.getElementById("pinned-count");
      const loadBtn = document.getElementById("btn-load-pinned-to-active");
      const clearBtn = document.getElementById("btn-clear-pinned");

      countBadge.textContent = state.pinned.length;
      list.innerHTML = "";

      if (state.pinned.length === 0) {
        list.innerHTML = `<span class="text-[11px] text-studio-muted/70 italic">Pin favorite colors across rolls to collect them here</span>`;
        loadBtn.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      loadBtn.classList.remove("hidden");
      clearBtn.classList.remove("hidden");

      state.pinned.forEach(hex => {
        const nameInfo = getClosestColorName(hex);
        const chip = document.createElement("div");
        chip.title = `${hex} (${nameInfo.label}) — Click hex to copy, or + to apply to active palette`;
        chip.className = "flex items-center gap-1.5 bg-studio-panel hover:bg-studio-hover border border-studio-border rounded-lg pl-1.5 pr-1 py-0.5 text-[11px] shrink-0 transition";

        const dot = document.createElement("span");
        dot.style.backgroundColor = hex;
        dot.className = "w-3.5 h-3.5 rounded border border-white/20 cursor-pointer";
        dot.onclick = () => copyTextToClipboard(hex);

        const label = document.createElement("button");
        label.className = "font-mono text-studio-text hover:text-white cursor-pointer";
        label.textContent = hex;
        label.onclick = () => copyTextToClipboard(hex);

        const applyBtn = document.createElement("button");
        applyBtn.className = "text-studio-muted hover:text-emerald-400 px-1 rounded cursor-pointer font-bold";
        applyBtn.title = "Apply color to active palette slot";
        applyBtn.textContent = "+";
        applyBtn.onclick = () => applyPinnedToSlot(hex);

        const delBtn = document.createElement("button");
        delBtn.className = "text-studio-muted hover:text-rose-400 px-1 rounded cursor-pointer";
        delBtn.title = "Remove pin";
        delBtn.textContent = "×";
        delBtn.onclick = () => unpinColor(hex);

        chip.appendChild(dot);
        chip.appendChild(label);
        chip.appendChild(applyBtn);
        chip.appendChild(delBtn);
        list.appendChild(chip);
      });
    }

    function loadSavedFromStorage() {
      try {
        const rawSaved = localStorage.getItem(STORAGE_KEY_SAVED);
        if (rawSaved) state.savedLibraries = JSON.parse(rawSaved);
        const rawPinned = localStorage.getItem(STORAGE_KEY_PINNED);
        if (rawPinned) state.pinned = JSON.parse(rawPinned);
      } catch (e) {
        // Ignore storage errors in restricted environments
      }
    }

    function saveLibraryToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_SAVED, JSON.stringify(state.savedLibraries));
      } catch (e) {}
    }

    function savePinnedToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_PINNED, JSON.stringify(state.pinned));
      } catch (e) {}
    }

    function renderDrawerContents() {
      document.getElementById("drawer-active-count").textContent = `${state.slots.length} colors`;
      document.getElementById("drawer-pinned-count").textContent = `${state.pinned.length} pinned`;

      const savedList = document.getElementById("saved-palettes-list");
      savedList.innerHTML = "";

      if (state.savedLibraries.length === 0) {
        savedList.innerHTML = `<div class="text-studio-muted text-[11px] bg-studio-panel/50 border border-studio-border rounded-xl p-3 text-center">No saved palettes yet. Save your active palette or pinned swatches above.</div>`;
      } else {
        state.savedLibraries.forEach(item => {
          const card = document.createElement("div");
          card.className = "bg-studio-panel border border-studio-border rounded-xl p-3 space-y-2";

          const top = document.createElement("div");
          top.className = "flex items-center justify-between gap-2";
          top.innerHTML = `
            <div class="min-w-0">
              <div class="font-medium text-white truncate">${item.name}</div>
              <div class="text-[10px] text-studio-muted uppercase tracking-wider">${item.type === "pinned" ? "Pinned Set" : "Palette"} · ${item.colors.length} colors</div>
            </div>
          `;

          const actions = document.createElement("div");
          actions.className = "flex items-center gap-1.5 shrink-0";

          const loadActiveBtn = document.createElement("button");
          loadActiveBtn.className = "bg-white text-studio-bg hover:bg-gray-200 font-medium px-2.5 py-1 rounded-md text-[11px] cursor-pointer";
          loadActiveBtn.textContent = "Load";
          loadActiveBtn.onclick = () => {
            loadColorsIntoActive(item.colors);
            closeDrawer();
            showToast(`Loaded "${item.name}"`);
          };

          const loadPinsBtn = document.createElement("button");
          loadPinsBtn.className = "bg-studio-bg hover:bg-studio-hover border border-studio-border text-white px-2 py-1 rounded-md text-[11px] cursor-pointer";
          loadPinsBtn.textContent = "To Pins";
          loadPinsBtn.onclick = () => {
            state.pinned = [...new Set([...state.pinned, ...item.colors])];
            savePinnedToStorage();
            renderPinnedDock();
            showToast(`Added ${item.colors.length} colors to Pinned`);
          };

          const delBtn = document.createElement("button");
          delBtn.className = "text-studio-muted hover:text-rose-400 px-1.5 py-1 rounded text-xs cursor-pointer";
          delBtn.textContent = "×";
          delBtn.onclick = () => {
            state.savedLibraries = state.savedLibraries.filter(x => x.id !== item.id);
            saveLibraryToStorage();
            renderDrawerContents();
          };

          actions.appendChild(loadActiveBtn);
          actions.appendChild(loadPinsBtn);
          actions.appendChild(delBtn);
          top.appendChild(actions);

          const strip = document.createElement("div");
          strip.className = "h-5 rounded-md overflow-hidden flex border border-white/10";
          item.colors.forEach(c => {
            const seg = document.createElement("div");
            seg.style.backgroundColor = c;
            seg.className = "flex-1 h-full";
            strip.appendChild(seg);
          });

          card.appendChild(top);
          card.appendChild(strip);
          savedList.appendChild(card);
        });
      }

      // Starter Palettes
      const starterList = document.getElementById("starter-palettes-list");
      starterList.innerHTML = "";
      STARTER_PALETTES.forEach(sp => {
        const card = document.createElement("div");
        card.className = "bg-studio-panel border border-studio-border rounded-xl p-3 space-y-2 hover:border-white/20 transition cursor-pointer";
        card.onclick = () => {
          loadColorsIntoActive(sp.colors);
          closeDrawer();
          showToast(`Loaded "${sp.name}"`);
        };
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-medium text-white">${sp.name}</span>
            <span class="text-[11px] text-studio-muted">Click to load</span>
          </div>
          <div class="h-4 rounded-md overflow-hidden flex border border-white/10">
            ${sp.colors.map(c => `<div style="background:${c}" class="flex-1 h-full"></div>`).join("")}
          </div>
        `;
        starterList.appendChild(card);
      });
    }

    function loadColorsIntoActive(hexArray) {
      const valid = hexArray.map(normalizeHex).filter(Boolean).slice(0, 24);
      if (valid.length === 0) return;
      state.slots = valid.map(hex => ({
        id: nextSlotId(),
        hex,
        locked: false
      }));
      pushHistory();
      renderAll();
    }

    function openDrawer() {
      renderDrawerContents();
      document.getElementById("drawer-backdrop").classList.remove("hidden");
      document.getElementById("palettes-drawer").classList.remove("translate-x-full");
    }

    function closeDrawer() {
      document.getElementById("drawer-backdrop").classList.add("hidden");
      document.getElementById("palettes-drawer").classList.add("translate-x-full");
    }

    /**
     * =========================================================================
     * 17. MASTER RENDER & INITIALIZATION
     * =========================================================================
     */
    function renderViewSwitcher() {
      const nav = document.getElementById("view-switcher");
      nav.innerHTML = "";
      VIEW_MODES.forEach(mode => {
        const btn = document.createElement("button");
        const active = state.view === mode.id;
        btn.className = `px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition cursor-pointer ${
          active ? "bg-white text-studio-bg shadow-sm" : "text-studio-muted hover:text-white hover:bg-studio-hover"
        }`;
        btn.textContent = mode.label;
        btn.onclick = () => {
          state.view = mode.id;
          renderViewSwitcher();
          renderStage();
        };
        nav.appendChild(btn);
      });
    }

    function renderStage() {
      const stage = document.getElementById("stage");
      stage.innerHTML = "";

      // Apply CVD Filter if active
      if (state.cvd === "none") {
        stage.style.filter = "none";
      } else {
        stage.style.filter = `url(#cvd-${state.cvd})`;
      }

      switch (state.view) {
        case "grid": renderGridView(stage); break;
        case "mosaic": renderMosaicView(stage); break;
        case "ui": renderUiMockupView(stage); break;
        case "dots": renderScatteredDotsView(stage); break;
        case "strips": renderStripsView(stage); break;
        case "gradients": renderGradientStripsView(stage); break;
        case "creature": renderCreatureView(stage); break;
      }
    }

    function renderAll() {
      document.getElementById("count-display").textContent = state.slots.length;
      document.getElementById("btn-count-dec").disabled = state.slots.length <= 1;
      document.getElementById("btn-count-inc").disabled = state.slots.length >= 24;
      renderPinnedDock();
      renderStage();
    }

    function initApp() {
      loadSavedFromStorage();

      // Default N = 7 slots
      state.slots = Array.from({ length: 7 }, () => ({
        id: nextSlotId(),
        hex: "#111216",
        locked: false
      }));
      generatePalette(true);

      renderViewSwitcher();
      bindPopoverEvents();

      // Primary Toolbar Controls
      document.getElementById("btn-generate").addEventListener("click", () => generatePalette(true));
      document.getElementById("btn-undo").addEventListener("click", undo);
      document.getElementById("btn-redo").addEventListener("click", redo);
      document.getElementById("btn-count-dec").addEventListener("click", () => setPaletteCount(state.slots.length - 1));
      document.getElementById("btn-count-inc").addEventListener("click", () => setPaletteCount(state.slots.length + 1));

      document.getElementById("cvd-select").addEventListener("change", e => {
        state.cvd = e.target.value;
        renderStage();
      });

      // Pinned Dock Bulk Actions
      document.getElementById("btn-load-pinned-to-active").addEventListener("click", () => {
        if (state.pinned.length === 0) return;
        loadColorsIntoActive(state.pinned);
        showToast("Loaded Pinned Swatches into active palette");
      });

      document.getElementById("btn-clear-pinned").addEventListener("click", () => {
        state.pinned = [];
        savePinnedToStorage();
        renderPinnedDock();
        showToast("Cleared pinned swatches");
      });

      // Drawer Controls
      document.getElementById("btn-open-drawer").addEventListener("click", openDrawer);
      document.getElementById("btn-close-drawer").addEventListener("click", closeDrawer);
      document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);

      document.getElementById("btn-save-active").addEventListener("click", () => {
        const input = document.getElementById("save-active-name");
        const name = input.value.trim() || `Palette (${state.slots.length} colors)`;
        state.savedLibraries.unshift({
          id: Date.now().toString(),
          name,
          type: "palette",
          colors: state.slots.map(s => s.hex),
          createdAt: new Date().toISOString()
        });
        input.value = "";
        saveLibraryToStorage();
        renderDrawerContents();
        showToast(`Saved "${name}"`);
      });

      document.getElementById("btn-save-pinned").addEventListener("click", () => {
        if (state.pinned.length === 0) {
          showToast("Pin at least 1 color first", "#F43F5E");
          return;
        }
        const input = document.getElementById("save-pinned-name");
        const name = input.value.trim() || `Pinned Set (${state.pinned.length})`;
        state.savedLibraries.unshift({
          id: Date.now().toString(),
          name,
          type: "pinned",
          colors: [...state.pinned],
          createdAt: new Date().toISOString()
        });
        input.value = "";
        saveLibraryToStorage();
        renderDrawerContents();
        showToast(`Saved "${name}"`);
      });

      document.getElementById("btn-export-css").addEventListener("click", () => {
        const css = `:root {\n${state.slots.map((s, i) => `  --color-${i + 1}: ${s.hex}; /* ${getClosestColorName(s.hex).label} */`).join("\n")}\n}`;
        copyTextToClipboard(css, "Copied CSS variables to clipboard");
      });

      document.getElementById("btn-export-json").addEventListener("click", () => {
        const json = JSON.stringify(state.slots.map(s => s.hex));
        copyTextToClipboard(json, "Copied JSON array to clipboard");
      });

      document.getElementById("btn-import-json").addEventListener("click", () => {
        const raw = document.getElementById("import-json-input").value.trim();
        if (!raw) return;
        const matches = raw.match(/#?[0-9A-Fa-f]{6}\b/g);
        if (!matches || matches.length === 0) {
          showToast("No valid hex codes found", "#F43F5E");
          return;
        }
        loadColorsIntoActive(matches);
        document.getElementById("import-json-input").value = "";
        closeDrawer();
        showToast(`Imported ${Math.min(24, matches.length)} colors`);
      });

      // Global Keyboard Shortcuts (Spacebar Generate, Ctrl/Cmd+Z Undo, Ctrl/Cmd+Y Redo)
      document.addEventListener("keydown", e => {
        const tag = document.activeElement?.tagName;
        const isTyping = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
          if (isTyping) return;
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
          if (isTyping) return;
          e.preventDefault();
          redo();
          return;
        }

        if (e.code === "Space" && !isTyping) {
          e.preventDefault();
          generatePalette(true);
        } else if (e.key === "Escape") {
          closePopover();
          closeDrawer();
        }
      });

      // Re-compute responsive layouts smoothly on resize
      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (state.view === "grid" || state.view === "dots") {
            renderStage();
          }
        }, 120);
      });
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
