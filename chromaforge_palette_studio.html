<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChromaForge — Minimalist Color Palette Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            studio: {
              bg: '#111216',
              bar: '#181A20',
              panel: '#1F222B',
              hover: '#272B36',
              border: '#2A2E3B',
              text: '#F3F4F6',
              muted: '#8E94A5',
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #111216;
      color: #F3F4F6;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      height: 100%;
    }

    /* Custom subtle studio scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #14161B;
    }
    ::-webkit-scrollbar-thumb {
      background: #2D3240;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3F4659;
    }

    /* Custom range sliders for HSL popover */
    input[type="range"].chroma-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    input[type="range"].chroma-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid #111216;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type="range"].chroma-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    input[type="range"].chroma-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid #111216;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }

    /* Drag & Drop visual cue */
    .drag-over-target {
      outline: 2px dashed rgba(255, 255, 255, 0.85) !important;
      outline-offset: -4px;
      transform: scale(0.985);
    }

    /* Panning cursor */
    .pan-grab {
      cursor: grab;
    }
    .pan-grabbing {
      cursor: grabbing !important;
      user-select: none;
    }

    /* Subtle pulse for spirit orbs */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="flex flex-col h-screen select-none bg-studio-bg text-studio-text">

  <!-- SVG Color Vision Deficiency (CVD) Filters -->
  <svg class="hidden" aria-hidden="true">
    <defs>
      <filter id="cvd-protanopia">
        <feColorMatrix type="matrix" values="
          0.567, 0.433, 0,     0, 0
          0.558, 0.442, 0,     0, 0
          0,     0.242, 0.758, 0, 0
          0,     0,     0,     1, 0" />
      </filter>
      <filter id="cvd-deuteranopia">
        <feColorMatrix type="matrix" values="
          0.625, 0.375, 0,   0, 0
          0.7,   0.3,   0,   0, 0
          0,     0.3,   0.7, 0, 0
          0,     0,     0,   1, 0" />
      </filter>
      <filter id="cvd-tritanopia">
        <feColorMatrix type="matrix" values="
          0.95, 0.05,  0,     0, 0
          0,    0.433, 0.567, 0, 0
          0,    0.475, 0.525, 0, 0
          0,    0,     0,     1, 0" />
      </filter>
    </defs>
  </svg>

  <!-- TOP STUDIO HEADER -->
  <header class="bg-studio-bar border-b border-studio-border px-3 sm:px-4 py-2.5 flex flex-wrap items-center justify-between gap-2.5 z-30 shrink-0">
    <!-- Left: Brand + Primary Actions -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Logo -->
      <div class="flex items-center gap-2 pr-1">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 via-fuchsia-500 to-amber-400 p-[1.5px] shadow-sm">
          <div class="w-full h-full bg-studio-bar rounded-[6.5px] flex items-center justify-center">
            <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"></polygon>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>
        <span class="font-semibold tracking-tight text-sm sm:text-base text-white hidden sm:inline">ChromaForge</span>
      </div>

      <!-- Generate Button -->
      <button id="btn-generate" title="Generate new unlocked colors (Spacebar)"
        class="flex items-center gap-2 bg-white text-studio-bg hover:bg-gray-100 active:scale-[0.98] font-medium text-xs sm:text-sm px-3.5 py-1.5 rounded-lg shadow-sm transition cursor-pointer">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
        <span>Generate</span>
        <kbd class="hidden md:inline-block text-[10px] font-mono bg-black/10 text-black/70 px-1.5 py-0.5 rounded">Space</kbd>
      </button>

      <!-- Undo / Redo -->
      <div class="flex items-center bg-studio-panel border border-studio-border rounded-lg p-0.5">
        <button id="btn-undo" title="Undo (Ctrl+Z)" disabled
          class="p-1.5 rounded-md text-studio-muted hover:text-white hover:bg-studio-hover disabled:opacity-35 disabled:pointer-events-none transition cursor-pointer">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
          </svg>
        </button>
        <button id="btn-redo" title="Redo (Ctrl+Y)" disabled
          class="p-1.5 rounded-md text-studio-muted hover:text-white hover:bg-studio-hover disabled:opacity-35 disabled:pointer-events-none transition cursor-pointer">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
          </svg>
        </button>
      </div>

      <!-- N-Count Stepper -->
      <div class="flex items-center bg-studio-panel border border-studio-border rounded-lg p-0.5" title="Number of colors in palette (1–24)">
        <button id="btn-count-dec" aria-label="Decrease color count"
          class="w-7 h-7 flex items-center justify-center rounded-md text-studio-muted hover:text-white hover:bg-studio-hover active:scale-95 transition cursor-pointer font-medium">
          −
        </button>
        <div class="px-2 text-xs font-mono font-semibold text-white min-w-[2.4rem] text-center" id="count-display">7</div>
        <button id="btn-count-inc" aria-label="Increase color count"
          class="w-7 h-7 flex items-center justify-center rounded-md text-studio-muted hover:text-white hover:bg-studio-hover active:scale-95 transition cursor-pointer font-medium">
          +
        </button>
      </div>
    </div>

    <!-- Center: 7 View Mode Switcher -->
    <nav id="view-switcher" aria-label="View Modes"
      class="flex items-center bg-studio-panel border border-studio-border rounded-lg p-0.5 overflow-x-auto max-w-full order-3 lg:order-2">
      <!-- Populated dynamically -->
    </nav>

    <!-- Right: CVD Simulator & Palettes Drawer -->
    <div class="flex items-center gap-2 order-2 lg:order-3">
      <!-- CVD Filter Selector -->
      <div class="relative flex items-center">
        <select id="cvd-select" title="Color Vision Deficiency Simulation"
          class="bg-studio-panel border border-studio-border text-xs text-studio-text rounded-lg pl-2.5 pr-7 py-1.5 focus:outline-none focus:border-white/30 cursor-pointer appearance-none">
          <option value="none">Vision: Normal</option>
          <option value="protanopia">Protanopia</option>
          <option value="deuteranopia">Deuteranopia</option>
          <option value="tritanopia">Tritanopia</option>
        </select>
        <svg class="w-3.5 h-3.5 text-studio-muted pointer-events-none absolute right-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>

      <!-- Palettes / Save & Export Drawer Trigger -->
      <button id="btn-open-drawer"
        class="flex items-center gap-1.5 bg-studio-panel hover:bg-studio-hover border border-studio-border text-xs font-medium text-white px-3 py-1.5 rounded-lg transition cursor-pointer">
        <svg class="w-3.5 h-3.5 text-studio-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span>Palettes</span>
      </button>
    </div>
  </header>

  <!-- EXTERNAL PINNED SWATCHES DOCK -->
  <section id="pinned-dock" class="bg-studio-bg border-b border-studio-border px-3 sm:px-4 py-1.5 flex items-center justify-between gap-3 shrink-0 z-20">
    <div class="flex items-center gap-2.5 overflow-x-auto py-0.5 flex-1 min-w-0">
      <div class="flex items-center gap-1.5 text-[11px] font-medium text-studio-muted shrink-0">
        <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 3a1 1 0 0 1 .117 1.993L16 5v4.764l1.894 3.789a1 1 0 0 1-.764 1.44L17 15h-4v6a1 1 0 0 1-1.993.117L11 21v-6H7a1 1 0 0 1-.993-.883L6 14a1 1 0 0 1 .057-.335l.049-.112L8 9.764V5a1 1 0 0 1-.117-1.993L8 3h8z"/>
        </svg>
        <span>Pinned</span>
        <span id="pinned-count" class="font-mono text-[10px] bg-studio-panel border border-studio-border px-1.5 py-0.2 rounded text-studio-text">0</span>
      </div>

      <div id="pinned-list" class="flex items-center gap-1.5">
        <!-- Pinned chips injected here -->
      </div>
    </div>

    <div id="pinned-actions" class="hidden sm:flex items-center gap-1.5 shrink-0">
      <button id="btn-load-pinned-to-active" title="Replace unlocked/active palette with pinned swatches"
        class="text-[11px] text-studio-muted hover:text-white bg-studio-panel hover:bg-studio-hover border border-studio-border px-2 py-1 rounded-md transition cursor-pointer hidden">
        Use as Palette
      </button>
      <button id="btn-clear-pinned" title="Clear all pinned swatches"
        class="text-[11px] text-studio-muted hover:text-rose-400 px-1.5 py-1 rounded-md transition cursor-pointer hidden">
        Clear
      </button>
    </div>
  </section>

  <!-- MAIN INTERACTIVE STAGE -->
  <main id="stage-wrapper" class="flex-1 relative overflow-hidden flex flex-col bg-studio-bg">
    <div id="stage" class="w-full h-full relative overflow-hidden">
      <!-- Active View Mode renders here -->
    </div>
  </main>

  <!-- FLOATING MANUAL COLOR EDITOR POPOVER -->
  <div id="color-popover" class="hidden fixed z-50 w-72 bg-studio-panel border border-studio-border rounded-xl shadow-2xl p-3.5 text-xs">
    <div class="flex items-center justify-between mb-2.5">
      <div class="flex items-center gap-2">
        <span id="popover-preview" class="w-5 h-5 rounded-md border border-white/20 shadow-inner"></span>
        <div>
          <div class="font-semibold text-white text-xs" id="popover-slot-label">Slot #1</div>
          <div class="text-[11px] text-studio-muted truncate max-w-[150px]" id="popover-color-name">~ Cerulean</div>
        </div>
      </div>
      <button id="popover-close" class="text-studio-muted hover:text-white p-1 rounded-lg hover:bg-studio-hover cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Hex + Native Picker Row -->
    <div class="flex items-center gap-2 mb-3">
      <label class="relative w-9 h-8 rounded-lg overflow-hidden border border-studio-border cursor-pointer shrink-0" title="System Color Picker">
        <input type="color" id="popover-native-picker" class="absolute -inset-2 w-14 h-14 cursor-pointer border-0 p-0" />
      </label>
      <input type="text" id="popover-hex-input" maxlength="7" placeholder="#RRGGBB"
        class="flex-1 bg-studio-bg border border-studio-border rounded-lg px-2.5 py-1.5 font-mono text-xs text-white uppercase focus:outline-none focus:border-white/40" />
      <button id="popover-copy-btn" title="Copy HEX"
        class="bg-studio-bg hover:bg-studio-hover border border-studio-border px-2.5 py-1.5 rounded-lg text-studio-muted hover:text-white transition cursor-pointer">
        Copy
      </button>
    </div>

    <!-- HSL Sliders -->
    <div class="space-y-2.5">
      <div>
        <div class="flex justify-between text-[11px] text-studio-muted mb-1">
          <span>Hue</span>
          <span class="font-mono text-studio-text" id="popover-h-val">180°</span>
        </div>
        <input type="range" id="popover-h" min="0" max="360" class="chroma-slider"
          style="background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);" />
      </div>

      <div>
        <div class="flex justify-between text-[11px] text-studio-muted mb-1">
          <span>Saturation</span>
          <span class="font-mono text-studio-text" id="popover-s-val">70%</span>
        </div>
        <input type="range" id="popover-s" min="0" max="100" class="chroma-slider" />
      </div>

      <div>
        <div class="flex justify-between text-[11px] text-studio-muted mb-1">
          <span>Lightness</span>
          <span class="font-mono text-studio-text" id="popover-l-val">50%</span>
        </div>
        <input type="range" id="popover-l" min="0" max="100" class="chroma-slider" />
      </div>
    </div>
  </div>

  <!-- SLIDE-OVER PALETTES & EXPORT DRAWER -->
  <div id="drawer-backdrop" class="hidden fixed inset-0 bg-black/60 backdrop-blur-[1px] z-40 transition-opacity"></div>
  <aside id="palettes-drawer"
    class="fixed top-0 right-0 h-full w-full max-w-md bg-studio-bar border-l border-studio-border z-50 transform translate-x-full transition-transform duration-200 flex flex-col shadow-2xl">
    <div class="px-4 py-3.5 border-b border-studio-border flex items-center justify-between">
      <h2 class="font-semibold text-sm text-white">Palettes, Pins & Export</h2>
      <button id="btn-close-drawer" class="text-studio-muted hover:text-white p-1.5 rounded-lg hover:bg-studio-hover cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-6 text-xs">
      <!-- Save Current Active Palette -->
      <div class="bg-studio-panel border border-studio-border rounded-xl p-3.5 space-y-2.5">
        <div class="font-semibold text-white flex items-center justify-between">
          <span>Save Active Palette</span>
          <span class="text-[11px] font-mono text-studio-muted" id="drawer-active-count">7 colors</span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="save-active-name" placeholder="e.g., Midnight Studio Theme"
            class="flex-1 bg-studio-bg border border-studio-border rounded-lg px-3 py-1.5 text-white placeholder-studio-muted focus:outline-none focus:border-white/30" />
          <button id="btn-save-active"
            class="bg-white text-studio-bg hover:bg-gray-200 font-medium px-3.5 py-1.5 rounded-lg transition cursor-pointer shrink-0">
            Save
          </button>
        </div>
      </div>

      <!-- Save Pinned Tray -->
      <div class="bg-studio-panel border border-studio-border rounded-xl p-3.5 space-y-2.5">
        <div class="font-semibold text-white flex items-center justify-between">
          <span>Save Pinned Swatches</span>
          <span class="text-[11px] font-mono text-studio-muted" id="drawer-pinned-count">0 pinned</span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="save-pinned-name" placeholder="e.g., Favorite Accents"
            class="flex-1 bg-studio-bg border border-studio-border rounded-lg px-3 py-1.5 text-white placeholder-studio-muted focus:outline-none focus:border-white/30" />
          <button id="btn-save-pinned"
            class="bg-studio-hover hover:bg-white/15 border border-studio-border text-white font-medium px-3.5 py-1.5 rounded-lg transition cursor-pointer shrink-0">
            Save Pins
          </button>
        </div>
      </div>

      <!-- Export & Import -->
      <div class="bg-studio-panel border border-studio-border rounded-xl p-3.5 space-y-3">
        <div class="font-semibold text-white">Export & Import</div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-export-css"
            class="bg-studio-bg hover:bg-studio-hover border border-studio-border text-white py-2 px-3 rounded-lg font-medium transition cursor-pointer flex items-center justify-center gap-1.5">
            <span>Copy CSS Vars</span>
          </button>
          <button id="btn-export-json"
            class="bg-studio-bg hover:bg-studio-hover border border-studio-border text-white py-2 px-3 rounded-lg font-medium transition cursor-pointer flex items-center justify-center gap-1.5">
            <span>Copy JSON</span>
          </button>
        </div>
        <div class="pt-1 border-t border-studio-border/60 space-y-2">
          <label class="block text-[11px] text-studio-muted">Import Hex Array or JSON (e.g. ["#111216", "#6366F1"])</label>
          <div class="flex gap-2">
            <input type="text" id="import-json-input" placeholder='["#1E293B", "#38BDF8", "#F43F5E"]'
              class="flex-1 bg-studio-bg border border-studio-border rounded-lg px-2.5 py-1.5 font-mono text-[11px] text-white placeholder-studio-muted focus:outline-none focus:border-white/30" />
            <button id="btn-import-json"
              class="bg-studio-hover hover:bg-white/15 border border-studio-border text-white px-3 py-1.5 rounded-lg font-medium transition cursor-pointer">
              Import
            </button>
          </div>
        </div>
      </div>

      <!-- Saved Library -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="font-semibold text-white">Saved Library</span>
          <span class="text-[11px] text-studio-muted">Stored locally in browser</span>
        </div>
        <div id="saved-palettes-list" class="space-y-2">
          <!-- Saved items injected here -->
        </div>
      </div>

      <!-- Curated Starter Themes -->
      <div class="space-y-2.5 pb-4">
        <span class="font-semibold text-white block">Curated Starter Palettes</span>
        <div id="starter-palettes-list" class="space-y-2">
          <!-- Starter items injected here -->
        </div>
      </div>
    </div>
  </aside>

  <!-- SUBTLE TOAST FEEDBACK -->
  <div id="toast"
    class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-200 bg-studio-panel border border-white/15 text-white text-xs font-medium px-3.5 py-2 rounded-full shadow-xl flex items-center gap-2">
    <span id="toast-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
    <span id="toast-msg">Copied #FFFFFF</span>
  </div>

  <script>
    /**
     * =========================================================================
     * 1. EMBEDDED EVOCATIVE PIGMENT, ARTIST & X11 COLOR DATABASE (~320 NAMES)
     * =========================================================================
     */
    const COLOR_DATABASE = [
      // Deep Neutrals & Blacks
      ["Obsidian", "#0B0C10"], ["Vantablack Mist", "#111216"], ["Carbon Ink", "#16181D"],
      ["Midnight Slate", "#1E222B"], ["Charcoal", "#2B2F3A"], ["Graphite", "#383E4C"],
      ["Iron Ore", "#474E5D"], ["Pewter", "#646B7A"], ["Steel Gray", "#7A8291"],
      ["Silver Mist", "#9BA3B2"], ["Ash Gray", "#B4BBC7"], ["Dove Gray", "#CBD0D8"],
      ["Cloud White", "#E5E8EE"], ["Alabaster", "#F4F3EF"], ["Ivory", "#FAF8F2"],
      ["Pure Snow", "#FFFFFF"], ["Pitch Black", "#000000"], ["Onyx", "#141414"],
      ["Basalt", "#262629"], ["Flint", "#52525B"], ["Zinc", "#71717A"],
      ["Warm Stone", "#78716C"], ["Taupe", "#8B8178"], ["Greige", "#A8A29E"],
      ["Sandstone", "#D6CFC7"], ["Parchment", "#EFECE6"], ["Bone", "#E3DEC9"],

      // Reds, Scarlets & Crimsons
      ["Crimson", "#DC143C"], ["Alizarin Crimson", "#E32636"], ["Vermilion", "#E34234"],
      ["Cinnabar", "#E44D2E"], ["Scarlet", "#FF2400"], ["Carmine", "#960018"],
      ["Venetian Red", "#C80815"], ["Ruby", "#E0115F"], ["Garnet", "#733635"],

    /**
     * =========================================================================
     * 2. PERCEPTUAL COLOR MATH (HEX, RGB, HSL, CIELAB & DELTA-E)
     * =========================================================================
     */
    function normalizeHex(hex) {
      if (!hex) return "#000000";
      let h = String(hex).trim().replace(/^#/, "");
      if (h.length === 3) {
        h = h.split("").map(c => c + c).join("");
      }
      if (!/^[0-9A-Fa-f]{6}$/.test(h)) return null;
      return "#" + h.toUpperCase();
    }

    function hexToRgb(hex) {
      const clean = normalizeHex(hex) || "#000000";
      const num = parseInt(clean.slice(1), 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function rgbToHex(r, g, b) {
      const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
      return "#" + [clamp(r), clamp(g), clamp(b)]
        .map(v => v.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };
    }

    function hslToRgb(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r1 = 0, g1 = 0, b1 = 0;
      if (h < 60) { r1 = c; g1 = x; b1 = 0; }
      else if (h < 120) { r1 = x; g1 = c; b1 = 0; }
      else if (h < 180) { r1 = 0; g1 = c; b1 = x; }
      else if (h < 240) { r1 = 0; g1 = x; b1 = c; }
      else if (h < 300) { r1 = x; g1 = 0; b1 = c; }
      else { r1 = c; g1 = 0; b1 = x; }
      return {
        r: Math.round((r1 + m) * 255),
        g: Math.round((g1 + m) * 255),
        b: Math.round((b1 + m) * 255)
      };
    }

    function hslToHex(h, s, l) {
      const { r, g, b } = hslToRgb(h, s, l);
      return rgbToHex(r, g, b);
    }

    function hexToHsl(hex) {
      const { r, g, b } = hexToRgb(hex);
      return rgbToHsl(r, g, b);
    }

    // RGB -> CIELAB (D65 illuminant)
    function rgbToLab(r, g, b) {
      let sr = r / 255, sg = g / 255, sb = b / 255;
      sr = sr > 0.04045 ? Math.pow((sr + 0.055) / 1.055, 2.4) : sr / 12.92;
      sg = sg > 0.04045 ? Math.pow((sg + 0.055) / 1.055, 2.4) : sg / 12.92;
      sb = sb > 0.04045 ? Math.pow((sb + 0.055) / 1.055, 2.4) : sb / 12.92;

      let x = (sr * 0.4124564 + sg * 0.3575761 + sb * 0.1804375) / 0.95047;
      let y = (sr * 0.2126729 + sg * 0.7151522 + sb * 0.0721750) / 1.00000;
      let z = (sr * 0.0193339 + sg * 0.1191920 + sb * 0.9503041) / 1.08883;

      const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t) + (16 / 116);
      const fx = f(x), fy = f(y), fz = f(z);

      return {
        L: (116 * fy) - 16,
        a: 500 * (fx - fy),
        b: 200 * (fy - fz)
      };
    }

    function hexToLab(hex) {
      const { r, g, b } = hexToRgb(hex);
      return rgbToLab(r, g, b);
    }

    // Perceptual CIE76 / Weighted Delta-E distance
    function deltaE(lab1, lab2) {
      const dL = lab1.L - lab2.L;
      const da = lab1.a - lab2.a;
      const db = lab1.b - lab2.b;
      return Math.sqrt(dL * dL + da * da + db * db);
    }

    // Precompute LAB coordinates for the embedded color database
    const PARSED_COLOR_DB = COLOR_DATABASE.map(([name, hex]) => ({
      name,
      hex: hex.toUpperCase(),
      lab: hexToLab(hex)
    }));

    const nameCache = new Map();
    function getClosestColorName(hex) {
      const key = normalizeHex(hex);
      if (nameCache.has(key)) return nameCache.get(key);
      const lab = hexToLab(key);
      let best = PARSED_COLOR_DB[0];
      let minD = Infinity;
      for (let i = 0; i < PARSED_COLOR_DB.length; i++) {
        const d = deltaE(lab, PARSED_COLOR_DB[i].lab);
        if (d < minD) {
          minD = d;
          best = PARSED_COLOR_DB[i];
          if (d === 0) break;
        }
      }
      const label = minD <= 2.3 ? best.name : `~ ${best.name}`;
      const res = { label, exactName: best.name, distance: minD };
      nameCache.set(key, res);
      return res;
    }

    // Perceived luminance for crisp foreground text contrast
    function getRelativeLuminance(hex) {
      const { r, g, b } = hexToRgb(hex);
      const srgb = [r, g, b].map(v => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
    }

    function getContrastText(hex) {
      return getRelativeLuminance(hex) > 0.34 ? "#111216" : "#F8FAFC";
    }

    function hexWithAlpha(hex, alpha) {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    /**

    const state = {
      slots: [], // Array of { id, hex, locked }

      savedLibraries: [], // Array of { id, name, type: 'palette'|'pinned', colors, createdAt }

    let uidCounter = 1;

    /**
     * =========================================================================
     * 4. PERCEPTUAL ANTI-SIMILARITY GENERATOR
     * =========================================================================
     */
    function generateDistinctColor(existingLabs, minThreshold) {
      let bestHex = "#6366F1";
      let bestMinDist = -1;

      // Try up to 48 candidates; accept immediately if above threshold, else take best
      const maxAttempts = 48;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        let h, s, l;
        if (attempt % 3 === 0 && existingLabs.length > 0) {
          // Harmonic jump from an existing color for cohesive variety
          const baseHue = Math.floor(Math.random() * 360);
          h = (baseHue + [30, 60, 120, 150, 180, 210][attempt % 6]) % 360;
          s = 35 + Math.floor(Math.random() * 58);
          l = 18 + Math.floor(Math.random() * 68);
        } else {
          h = Math.floor(Math.random() * 360);
          s = 12 + Math.floor(Math.random() * 83);
          l = 10 + Math.floor(Math.random() * 80);
        }

        const candidateHex = hslToHex(h, s, l);
        const candidateLab = hexToLab(candidateHex);

        if (existingLabs.length === 0) {
          return candidateHex;
        }

        let minDist = Infinity;
        for (let i = 0; i < existingLabs.length; i++) {
          const d = deltaE(candidateLab, existingLabs[i]);
          if (d < minDist) minDist = d;
        }

        if (minDist >= minThreshold) {
          return candidateHex;
        }

        if (minDist > bestMinDist) {
          bestMinDist = minDist;
          bestHex = candidateHex;
        }
      }
      return bestHex;
    }

    function getEffectiveThreshold(count) {
      // Base perceptual threshold Delta-E 24, gently scaled for very high N so generation is instant
      if (count <= 7) return 24;
      return Math.max(9.5, 24 - (count - 7) * 0.85);
    }

    function generatePalette(pushToHistory = true) {
      const count = state.slots.length;
      const threshold = getEffectiveThreshold(count);

      // Start with all locked colors as protected perceptual anchors
      const acceptedLabs = state.slots
        .filter(s => s.locked)
        .map(s => hexToLab(s.hex));

      const nextSlots = state.slots.map(slot => {
        if (slot.locked) return { ...slot };
        const newHex = generateDistinctColor(acceptedLabs, threshold);
        acceptedLabs.push(hexToLab(newHex));
        return { ...slot, hex: newHex };
      });

      state.slots = nextSlots;
      if (pushToHistory) pushHistory();
      renderAll();
    }

    function setPaletteCount(newCount) {
      const clamped = Math.max(1, Math.min(24, newCount));
      if (clamped === state.slots.length) return;

      if (clamped < state.slots.length) {
        state.slots = state.slots.slice(0, clamped);
      } else {
        const threshold = getEffectiveThreshold(clamped);
        const acceptedLabs = state.slots.map(s => hexToLab(s.hex));
        while (state.slots.length < clamped) {
          const hex = generateDistinctColor(acceptedLabs, threshold);
          acceptedLabs.push(hexToLab(hex));
          state.slots.push({ id: nextSlotId(), hex, locked: false });
        }
      }

      if (state.editingSlotIndex !== null && state.editingSlotIndex >= clamped) {
        closePopover();
      }
      pushHistory();
      renderAll();
    }

    function pushHistory() {
      const snapshot = state.slots.map(s => ({ hex: s.hex, locked: s.locked }));
      // Trim forward history if we branched
      if (state.historyIndex < state.history.length - 1) {
        state.history = state.history.slice(0, state.historyIndex + 1);
      }
      state.history.push(snapshot);
      if (state.history.length > 30) {
        state.history.shift();
      } else {
        state.historyIndex++;
      }
      updateHistoryButtons();
    }

    function undo() {
      if (state.historyIndex <= 0) return;
      state.historyIndex--;
      restoreSnapshot(state.history[state.historyIndex]);
    }

    function redo() {
      if (state.historyIndex >= state.history.length - 1) return;
      state.historyIndex++;
      restoreSnapshot(state.history[state.historyIndex]);
    }

    function restoreSnapshot(snapshot) {
      closePopover();
      state.slots = snapshot.map((item, i) => ({
        id: state.slots[i]?.id || nextSlotId(),
        hex: item.hex,
        locked: item.locked
      }));
      updateHistoryButtons();
      renderAll();
    }

    function updateHistoryButtons() {
      document.getElementById("btn-undo").disabled = state.historyIndex <= 0;
      document.getElementById("btn-redo").disabled = state.historyIndex >= state.history.length - 1;
    }

    /**
     * =========================================================================
     * 5. SLOT ACTIONS: LOCK, PIN, SWAP, COPY, MANUAL EDIT
     * =========================================================================
     */
    function toggleLock(index) {
      if (!state.slots[index]) return;
      state.slots[index].locked = !state.slots[index].locked;
      pushHistory();
      renderAll();
    }

    function swapSlots(indexA, indexB) {
      if (
        indexA === indexB ||
        indexA < 0 || indexB < 0 ||
        indexA >= state.slots.length || indexB >= state.slots.length
      ) return;
      const temp = state.slots[indexA];
      state.slots[indexA] = state.slots[indexB];
      state.slots[indexB] = temp;
      if (state.editingSlotIndex === indexA) state.editingSlotIndex = indexB;
      else if (state.editingSlotIndex === indexB) state.editingSlotIndex = indexA;
      pushHistory();
      renderAll();
    }

    function updateSlotHex(index, newHex, recordHistory = true) {
      const normalized = normalizeHex(newHex);
      if (!normalized || !state.slots[index]) return;
      state.slots[index].hex = normalized;
      if (recordHistory) pushHistory();
      renderAll();
    }

    function pinColor(hex) {
      const normalized = normalizeHex(hex);
      if (!normalized) return;
      if (state.pinned.includes(normalized)) {
        showToast(`${normalized} is already pinned`, normalized);
        return;
      }
      state.pinned.push(normalized);
      savePinnedToStorage();
      renderPinnedDock();
      showToast(`Pinned ${normalized}`, normalized);
    }

    function unpinColor(hex) {
      state.pinned = state.pinned.filter(h => h !== hex);
      savePinnedToStorage();
      renderPinnedDock();
    }

    function applyPinnedToSlot(hex) {
      // Apply to currently open popover slot, or first unlocked slot, or slot 0
      let targetIdx = state.editingSlotIndex;
      if (targetIdx === null || targetIdx >= state.slots.length) {
        targetIdx = state.slots.findIndex(s => !s.locked);
      }
      if (targetIdx === -1) targetIdx = 0;
      updateSlotHex(targetIdx, hex, true);
      showToast(`Applied ${hex} to Slot #${targetIdx + 1}`, hex);
    }

    function copyTextToClipboard(text, toastLabel) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
      } catch (e) {
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
      }
      document.body.removeChild(textarea);
      showToast(toastLabel || `Copied ${text}`, text.startsWith("#") ? text : "#10B981");
    }

    let toastTimer = null;
    function showToast(message, dotColor = "#10B981") {
      const toast = document.getElementById("toast");
      const msgEl = document.getElementById("toast-msg");
      const dotEl = document.getElementById("toast-dot");
      msgEl.textContent = message;
      dotEl.style.backgroundColor = normalizeHex(dotColor) || "#10B981";
      toast.classList.remove("opacity-0", "translate-y-2");
      toast.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        toast.classList.remove("opacity-100", "translate-y-0");
      }, 1800);
    }

    /**
     * =========================================================================
     * 6. MANUAL COLOR PICKER POPOVER
     * =========================================================================
     */
    function openColorPopover(index, anchorEl) {
      if (!state.slots[index]) return;
      state.editingSlotIndex = index;
      const popover = document.getElementById("color-popover");
      popover.classList.remove("hidden");
      syncPopoverValues();

      // Position near anchorEl while keeping within viewport bounds
      const rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2 - 144, top: window.innerHeight / 2 - 120, bottom: window.innerHeight / 2 };
      const popW = 288;
      const popH = 265;
      let left = rect.left + (rect.width ? rect.width / 2 - popW / 2 : 0);
      let top = rect.bottom + 8;

      if (left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
      if (left < 12) left = 12;
      if (top + popH > window.innerHeight - 12) {
        top = Math.max(12, rect.top - popH - 8);
      }

      popover.style.left = `${left}px`;
      popover.style.top = `${top}px`;
    }

    function closePopover() {
      state.editingSlotIndex = null;
      document.getElementById("color-popover").classList.add("hidden");
    }

    function syncPopoverValues() {
      const idx = state.editingSlotIndex;
      if (idx === null || !state.slots[idx]) return;
      const hex = state.slots[idx].hex;
      const hsl = hexToHsl(hex);
      const nameInfo = getClosestColorName(hex);

      document.getElementById("popover-preview").style.backgroundColor = hex;
      document.getElementById("popover-slot-label").textContent = `Slot #${idx + 1}`;
      document.getElementById("popover-color-name").textContent = nameInfo.label;
      document.getElementById("popover-native-picker").value = hex;
      document.getElementById("popover-hex-input").value = hex;

      const hSlider = document.getElementById("popover-h");
      const sSlider = document.getElementById("popover-s");
      const lSlider = document.getElementById("popover-l");

      hSlider.value = hsl.h;
      sSlider.value = hsl.s;
      lSlider.value = hsl.l;

      document.getElementById("popover-h-val").textContent = `${hsl.h}°`;
      document.getElementById("popover-s-val").textContent = `${hsl.s}%`;
      document.getElementById("popover-l-val").textContent = `${hsl.l}%`;

      sSlider.style.background = `linear-gradient(to right, ${hslToHex(hsl.h, 0, hsl.l)}, ${hslToHex(hsl.h, 100, hsl.l)})`;
      lSlider.style.background = `linear-gradient(to right, #000000, ${hslToHex(hsl.h, hsl.s, 50)}, #FFFFFF)`;
    }

    function bindPopoverEvents() {
      document.getElementById("popover-close").addEventListener("click", closePopover);

      document.getElementById("popover-native-picker").addEventListener("input", e => {
        if (state.editingSlotIndex === null) return;
        updateSlotHex(state.editingSlotIndex, e.target.value, false);
        syncPopoverValues();
      });
      document.getElementById("popover-native-picker").addEventListener("change", () => {
        pushHistory();
      });

      document.getElementById("popover-hex-input").addEventListener("input", e => {
        if (state.editingSlotIndex === null) return;
        const norm = normalizeHex(e.target.value);
        if (norm) {
          updateSlotHex(state.editingSlotIndex, norm, false);
          syncPopoverValues();
        }
      });
      document.getElementById("popover-hex-input").addEventListener("change", () => {
        pushHistory();
      });

      document.getElementById("popover-copy-btn").addEventListener("click", () => {
        if (state.editingSlotIndex === null) return;
        const hex = state.slots[state.editingSlotIndex].hex;
        copyTextToClipboard(hex, `Copied ${hex}`);
      });

      const handleHslSlide = (commitHistory) => {
        if (state.editingSlotIndex === null) return;
        const h = parseInt(document.getElementById("popover-h").value, 10);
        const s = parseInt(document.getElementById("popover-s").value, 10);
        const l = parseInt(document.getElementById("popover-l").value, 10);
        const newHex = hslToHex(h, s, l);
        updateSlotHex(state.editingSlotIndex, newHex, commitHistory);
        syncPopoverValues();
      };

      ["popover-h", "popover-s", "popover-l"].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener("input", () => handleHslSlide(false));
        el.addEventListener("change", () => handleHslSlide(true));
      });

      // Close popover on outside click
      document.addEventListener("mousedown", e => {
        const pop = document.getElementById("color-popover");
        if (!pop.classList.contains("hidden") && !pop.contains(e.target) && !e.target.closest("[data-open-popover]")) {
          closePopover();
        }
      });
    }

    /**
     * =========================================================================
     * 7. DRAG & DROP HELPER FOR ALL VIEWS
     * =========================================================================
     */
    function attachSlotDragHandlers(el, index) {
      el.setAttribute("draggable", "true");
      el.addEventListener("dragstart", e => {
        state.dragSourceIndex = index;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(index));
        el.style.opacity = "0.65";
      });
      el.addEventListener("dragend", () => {
        state.dragSourceIndex = null;
        el.style.opacity = "1";
        document.querySelectorAll(".drag-over-target").forEach(n => n.classList.remove("drag-over-target"));
      });
      el.addEventListener("dragover", e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (state.dragSourceIndex !== null && state.dragSourceIndex !== index) {
          el.classList.add("drag-over-target");
        }
      });
      el.addEventListener("dragleave", () => {
        el.classList.remove("drag-over-target");
      });
      el.addEventListener("drop", e => {
        e.preventDefault();
        el.classList.remove("drag-over-target");
        const src = state.dragSourceIndex !== null ? state.dragSourceIndex : parseInt(e.dataTransfer.getData("text/plain"), 10);
        if (!isNaN(src) && src !== index) {
          swapSlots(src, index);
        }
      });
    }

    /**
     * =========================================================================
     * 9. VIEW MODE 1: SQUARE(ISH) GRID (PANNABLE WHEN LARGE)
     * =========================================================================
     */
    function renderGridView(container) {
      const n = state.slots.length;
      const rect = container.getBoundingClientRect();
      const vw = Math.max(320, rect.width);
      const vh = Math.max(300, rect.height);

      const minTile = 165;
      const gap = 12;
      const pad = 20;

      // Choose balanced column count
      const aspect = vw / vh;
      let cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
      if (n <= 4) cols = Math.min(n, vw < 520 ? 2 : n);
      const rows = Math.ceil(n / cols);

      // Calculate tile size so all tiles are strictly evenly sized squares
      const fitW = Math.floor((vw - pad * 2 - gap * (cols - 1)) / cols);
      const fitH = Math.floor((vh - pad * 2 - gap * (rows - 1)) / rows);
      const idealSize = Math.min(fitW, fitH);
      const tileSize = Math.max(minTile, Math.min(340, idealSize));

      const totalGridW = cols * tileSize + (cols - 1) * gap + pad * 2;
      const totalGridH = rows * tileSize + (rows - 1) * gap + pad * 2;
      const needsPan = totalGridW > vw || totalGridH > vh;

      const viewport = document.createElement("div");
      viewport.className = `w-full h-full relative overflow-auto flex items-center justify-center ${needsPan ? "pan-grab" : ""}`;

      const grid = document.createElement("div");
      grid.style.display = "grid";
      grid.style.gridTemplateColumns = `repeat(${cols}, ${tileSize}px)`;
      grid.style.gap = `${gap}px`;
      grid.style.padding = `${pad}px`;
      if (needsPan) {
        grid.style.margin = "auto";
      }

      state.slots.forEach((slot, idx) => {
        const fg = getContrastText(slot.hex);
        const nameInfo = getClosestColorName(slot.hex);

        const card = document.createElement("div");
        card.style.width = `${tileSize}px`;
        card.style.height = `${tileSize}px`;
        card.style.backgroundColor = slot.hex;
        card.style.color = fg;
        card.className = "rounded-2xl p-3.5 flex flex-col justify-between shadow-lg border border-white/10 transition-transform duration-150 hover:scale-[1.015] relative group";
        attachSlotDragHandlers(card, idx);

        // Top row: Slot number + Lock badge
        const top = document.createElement("div");
        top.className = "flex items-center justify-between text-[11px] font-mono opacity-80";
        top.innerHTML = `
          <span>#${idx + 1}</span>
          ${slot.locked ? `<span class="px-1.5 py-0.5 rounded bg-black/20 text-[10px] font-sans font-medium">Locked</span>` : `<span></span>`}
        `;

        // Middle: HEX & Name
        const mid = document.createElement("div");
        mid.className = "flex flex-col items-center text-center my-auto";

        const hexBtn = document.createElement("button");
        hexBtn.className = "font-mono font-semibold text-base sm:text-lg tracking-wide hover:underline cursor-pointer";
        hexBtn.textContent = slot.hex;
        hexBtn.title = "Click to copy HEX";
        hexBtn.onclick = e => { e.stopPropagation(); copyTextToClipboard(slot.hex); };

        const nameEl = document.createElement("div");
        nameEl.className = "text-xs opacity-85 mt-0.5 truncate max-w-full px-1";
        nameEl.textContent = nameInfo.label;

        mid.appendChild(hexBtn);
        mid.appendChild(nameEl);

        // Bottom: Action controls
        const bottom = document.createElement("div");
        bottom.className = `flex justify-center transition-opacity ${slot.locked ? "opacity-100" : "opacity-85 sm:opacity-0 sm:group-hover:opacity-100"}`;
        bottom.appendChild(createSlotControlsBar(idx, fg, false));

        card.appendChild(top);
        card.appendChild(mid);
        card.appendChild(bottom);
        grid.appendChild(card);
      });

      viewport.appendChild(grid);
      container.appendChild(viewport);

      // Drag-to-pan behavior when grid exceeds viewport
      if (needsPan) {
        let isPanning = false;
        let startX = 0, startY = 0, scrollLeft = 0, scrollTop = 0;

        viewport.addEventListener("mousedown", e => {
          if (e.target.closest("button") || e.target.closest("[draggable='true']")) return;
          isPanning = true;
          viewport.classList.add("pan-grabbing");
          startX = e.pageX - viewport.offsetLeft;
          startY = e.pageY - viewport.offsetTop;
          scrollLeft = viewport.scrollLeft;
          scrollTop = viewport.scrollTop;
        });

        window.addEventListener("mouseup", () => {
          isPanning = false;
          viewport.classList.remove("pan-grabbing");
        });

        viewport.addEventListener("mousemove", e => {
          if (!isPanning) return;
          e.preventDefault();
          const x = e.pageX - viewport.offsetLeft;
          const y = e.pageY - viewport.offsetTop;
          viewport.scrollLeft = scrollLeft - (x - startX);
          viewport.scrollTop = scrollTop - (y - startY);
        });

        const panHint = document.createElement("div");
        panHint.className = "absolute bottom-3 right-3 bg-studio-panel/90 backdrop-blur border border-studio-border text-[11px] text-studio-muted px-3 py-1.5 rounded-full flex items-center gap-2 shadow-lg";
        panHint.innerHTML = `<span>Scroll or drag background to pan (${cols}×${rows})</span>`;
        const resetBtn = document.createElement("button");
        resetBtn.className = "text-white hover:underline font-medium cursor-pointer";
        resetBtn.textContent = "Center";
        resetBtn.onclick = () => {
          viewport.scrollTo({
            left: (viewport.scrollWidth - viewport.clientWidth) / 2,
            top: (viewport.scrollHeight - viewport.clientHeight) / 2,
            behavior: "smooth"
          });
        };
        panHint.appendChild(resetBtn);
        container.appendChild(panHint);
      }
    }

    /**
     * =========================================================================
     * 10. VIEW MODE 2: RANDOM MOSAIC (EQUAL-AREA GEOMETRIC TESSELLATION)
     * =========================================================================
     */
    function seededRng(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => (s = (s * 16807) % 2147483647) / 2147483647;
    }

    // Recursively partition a polygon into N equal-area convex sub-polygons
    function partitionPolygonEqualArea(poly, count, rng) {
      if (count <= 1) return [poly];
      const k = Math.floor(count / 2);
      const ratio = k / count;

      // Compute bounding box to pick split orientation
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      poly.forEach(([x, y]) => {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      });

      const horizontal = (maxY - minY) > (maxX - minX);
      // Slight diagonal tilt for artistic mosaic character while preserving exact area ratio
      const tilt = (rng() - 0.5) * 0.28;

      // Binary search cut offset so clipped polygon area equals ratio * totalArea
      const polyArea = pts => {
        let a = 0;
        for (let i = 0; i < pts.length; i++) {
          const [x1, y1] = pts[i];
          const [x2, y2] = pts[(i + 1) % pts.length];
          a += x1 * y2 - x2 * y1;
        }
        return Math.abs(a) / 2;
      };

      const clipHalfPlane = (pts, sign) => {
        // Line: (x - cx)*nx + (y - cy)*ny = c
        const nx = horizontal ? tilt : 1;
        const ny = horizontal ? 1 : tilt;
        const proj = pts.map(([x, y]) => x * nx + y * ny);
        const lo = Math.min(...proj), hi = Math.max(...proj);
        return { nx, ny, lo, hi };
      };

      const { nx, ny, lo, hi } = clipHalfPlane(poly, 1);
      const total = polyArea(poly);
      const target = total * ratio;

      const sliceAt = (threshold) => {
        const left = [], right = [];
        for (let i = 0; i < poly.length; i++) {
          const p1 = poly[i];
          const p2 = poly[(i + 1) % poly.length];
          const d1 = p1[0] * nx + p1[1] * ny - threshold;
          const d2 = p2[0] * nx + p2[1] * ny - threshold;
          if (d1 <= 0) left.push(p1);
          if (d1 >= 0) right.push(p1);
          if ((d1 < 0 && d2 > 0) || (d1 > 0 && d2 < 0)) {
            const t = d1 / (d1 - d2);
            const inter = [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])];
            left.push(inter);
            right.push(inter);
          }
        }
        return { left, right };
      };

      let low = lo, high = hi, bestSplit = sliceAt((lo + hi) / 2);
      for (let iter = 0; iter < 22; iter++) {
        const mid = (low + high) / 2;
        const split = sliceAt(mid);
        bestSplit = split;
        const aLeft = polyArea(split.left);
        if (aLeft < target) low = mid;
        else high = mid;
      }

      return [
        ...partitionPolygonEqualArea(bestSplit.left, k, rng),
        ...partitionPolygonEqualArea(bestSplit.right, count - k, rng)
      ];
    }

    function renderMosaicView(container) {
      const n = state.slots.length;
      const W = 1200, H = 760;
      const rng = seededRng(state.mosaicSeed + n * 17);
      const rootPoly = [[0, 0], [W, 0], [W, H], [0, H]];
      const cells = partitionPolygonEqualArea(rootPoly, n, rng);

      const wrapper = document.createElement("div");
      wrapper.className = "w-full h-full p-3 sm:p-5 flex flex-col items-center justify-center relative";

      const frame = document.createElement("div");
      frame.className = "w-full h-full rounded-2xl overflow-hidden border border-studio-border shadow-2xl relative bg-studio-panel";

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.className = "w-full h-full block";

      cells.forEach((pts, idx) => {
        const slot = state.slots[idx];
        if (!slot) return;
        const fg = getContrastText(slot.hex);
        const nameInfo = getClosestColorName(slot.hex);

        // Compute centroid
        let cx = 0, cy = 0;
        pts.forEach(([x, y]) => { cx += x; cy += y; });
        cx /= pts.length;
        cy /= pts.length;

        const g = document.createElementNS(svgNS, "g");
        g.className = "cursor-pointer group";

        const poly = document.createElementNS(svgNS, "polygon");
        poly.setAttribute("points", pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" "));
        poly.setAttribute("fill", slot.hex);
        poly.setAttribute("stroke", "#111216");
        poly.setAttribute("stroke-width", "3");
        poly.setAttribute("stroke-linejoin", "round");

        poly.addEventListener("click", () => copyTextToClipboard(slot.hex));
        g.appendChild(poly);

        // Overlay HTML-style foreignObject at centroid for crisp interactive badges
        const fo = document.createElementNS(svgNS, "foreignObject");
        const boxW = 160, boxH = 74;
        fo.setAttribute("x", Math.max(8, Math.min(W - boxW - 8, cx - boxW / 2)));
        fo.setAttribute("y", Math.max(8, Math.min(H - boxH - 8, cy - boxH / 2)));
        fo.setAttribute("width", boxW);
        fo.setAttribute("height", boxH);

        const badge = document.createElement("div");
        badge.style.color = fg;
        badge.className = "w-full h-full flex flex-col items-center justify-center text-center select-none";
        attachSlotDragHandlers(badge, idx);

        const hexLine = document.createElement("div");
        hexLine.className = "font-mono font-semibold text-xs tracking-wide drop-shadow-sm cursor-pointer hover:underline";
        hexLine.textContent = `${slot.locked ? "🔒 " : ""}${slot.hex}`;
        hexLine.onclick = e => { e.stopPropagation(); copyTextToClipboard(slot.hex); };

        const nameLine = document.createElement("div");
        nameLine.className = "text-[10px] opacity-85 truncate max-w-[140px]";
        nameLine.textContent = nameInfo.label;

        const ctrlWrap = document.createElement("div");
        ctrlWrap.className = "mt-1 opacity-0 group-hover:opacity-100 transition-opacity";
        ctrlWrap.appendChild(createSlotControlsBar(idx, fg, true));

        badge.appendChild(hexLine);
        badge.appendChild(nameLine);
        badge.appendChild(ctrlWrap);
        fo.appendChild(badge);
        g.appendChild(fo);
        svg.appendChild(g);
      });

      frame.appendChild(svg);
      wrapper.appendChild(frame);

      // Re-roll mosaic layout floating button
      const rerollBtn = document.createElement("button");
      rerollBtn.className = "absolute bottom-7 right-7 bg-studio-bar/90 hover:bg-studio-panel border border-studio-border text-white text-xs font-medium px-3.5 py-2 rounded-full shadow-xl flex items-center gap-1.5 backdrop-blur-md transition cursor-pointer";
      rerollBtn.innerHTML = `
        <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Re-roll Mosaic</span>
      `;
      rerollBtn.onclick = () => {
        state.mosaicSeed += 13;
        renderAll();
      };
      wrapper.appendChild(rerollBtn);
      container.appendChild(wrapper);
    }

    /**
     * =========================================================================
     * 11. VIEW MODE 3: INTERACTIVE UI MOCKUP (10-ROLE THEME PREVIEW)
     * =========================================================================
     */
    const UI_ROLES = [
      { key: "bg", label: "BG", desc: "Canvas Background" },
      { key: "bgAccent", label: "BG Accent", desc: "Subtle Section Tint" },
      { key: "text", label: "Plain Text", desc: "Primary Typography" },
      { key: "urgent", label: "Urgent Text", desc: "Alerts & Priority" },
      { key: "panel", label: "UI Panel", desc: "Cards & Containers" },
      { key: "hover", label: "UI Hover", desc: "Interactive Highlight" },
      { key: "button", label: "Button", desc: "Primary CTA Fill" },
      { key: "muted", label: "Muted Text", desc: "Secondary Labels" },
      { key: "border", label: "Border", desc: "1px Dividers" },
      { key: "accent2", label: "Accent 2", desc: "Secondary Highlight" }
    ];

    function renderUiMockupView(container) {
      const slots = state.slots;
      const n = slots.length;

    /**
     * =========================================================================
     * 12. VIEW MODE 4: RANDOM SCATTERED DOTS (NON-OVERLAPPING EVEN ORBS)
     * =========================================================================
     */
    function renderScatteredDotsView(container) {
      const n = state.slots.length;
      const rect = container.getBoundingClientRect();
      const W = Math.max(360, rect.width);
      const H = Math.max(340, rect.height);

      const bgMap = {
        dark: { bg: "#111216", text: "#F3F4F6", sub: "#8E94A5" },
        gray: { bg: "#7B808C", text: "#FFFFFF", sub: "#E5E7EB" },
        light: { bg: "#F4F3EF", text: "#111216", sub: "#52525B" }
      };
      const theme = bgMap[state.dotsBackdrop] || bgMap.dark;

      const board = document.createElement("div");
      board.style.backgroundColor = theme.bg;
      board.className = "w-full h-full relative overflow-hidden transition-colors duration-200";

      // Compute evenly sized orb radius that safely fits all N orbs with generous breathing room
      const usableArea = (W - 80) * (H - 110);
      const maxDiameter = Math.sqrt((usableArea * 0.44) / Math.max(1, n));
      const diameter = Math.max(66, Math.min(168, Math.floor(maxDiameter)));
      const radius = diameter / 2;
      const minGap = Math.max(14, radius * 0.25);

      const rng = seededRng(state.dotsSeed + n * 31);
      const positions = [];
      const padX = radius + 28;
      const padTop = radius + 28;
      const padBottom = radius + 64;

      for (let i = 0; i < n; i++) {
        let placed = null;
        for (let attempt = 0; attempt < 450; attempt++) {
          const cx = padX + rng() * Math.max(10, W - padX * 2);
          const cy = padTop + rng() * Math.max(10, H - padTop - padBottom);
          let overlaps = false;
          for (let j = 0; j < positions.length; j++) {
            const dx = cx - positions[j].x;
            const dy = cy - positions[j].y;
            if (Math.hypot(dx, dy) < diameter + minGap) {
              overlaps = true;
              break;
            }
          }
          if (!overlaps) {
            placed = { x: cx, y: cy };
            break;
          }
        }
        // Fallback grid jitter if density is super high on a tiny mobile screen
        if (!placed) {
          const cols = Math.ceil(Math.sqrt(n * (W / H)));
          const col = i % cols;
          const row = Math.floor(i / cols);
          const cellW = (W - 60) / cols;
          const cellH = (H - 90) / Math.ceil(n / cols);
          placed = {
            x: 30 + cellW * (col + 0.5),
            y: 30 + cellH * (row + 0.5)
          };
        }
        positions.push(placed);
      }

      positions.forEach((pos, idx) => {
        const slot = state.slots[idx];
        const fg = getContrastText(slot.hex);
        const nameInfo = getClosestColorName(slot.hex);

        const orb = document.createElement("div");
        orb.style.width = `${diameter}px`;
        orb.style.height = `${diameter}px`;
        orb.style.left = `${pos.x - radius}px`;
        orb.style.top = `${pos.y - radius}px`;
        orb.style.backgroundColor = slot.hex;
        orb.style.color = fg;
        orb.className = "absolute rounded-full shadow-2xl flex flex-col items-center justify-center text-center p-2 transition-transform duration-150 hover:scale-105 hover:z-20 group cursor-pointer border border-white/15";
        attachSlotDragHandlers(orb, idx);

        const hexEl = document.createElement("div");
        hexEl.className = `font-mono font-semibold ${diameter < 90 ? "text-[10px]" : "text-xs"} tracking-tight hover:underline`;
        hexEl.textContent = `${slot.locked ? "🔒" : ""}${slot.hex}`;
        hexEl.onclick = e => { e.stopPropagation(); copyTextToClipboard(slot.hex); };
        orb.appendChild(hexEl);

        if (diameter >= 88) {
          const nameEl = document.createElement("div");
          nameEl.className = "text-[10px] opacity-85 truncate max-w-[85%] mt-0.5";
          nameEl.textContent = nameInfo.label;
          orb.appendChild(nameEl);
        }

        // Hover action pill floating right under the orb
        const actionWrap = document.createElement("div");
        actionWrap.className = "absolute -bottom-8 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity z-30 shadow-xl rounded-full bg-studio-panel border border-studio-border";
        actionWrap.appendChild(createSlotControlsBar(idx, "#F8FAFC", true));
        orb.appendChild(actionWrap);

        board.appendChild(orb);
      });

      // Bottom Floating Controls: Backdrop Switcher + Re-scatter
      const controls = document.createElement("div");
      controls.className = "absolute bottom-4 left-1/2 -translate-x-1/2 bg-studio-panel/95 backdrop-blur border border-studio-border rounded-full px-3 py-1.5 flex items-center gap-2 shadow-xl z-20 text-xs";

      const bgModes = [
        { id: "dark", label: "Dark" },
        { id: "gray", label: "Gray" },
        { id: "light", label: "Light" }
      ];
      bgModes.forEach(m => {
        const b = document.createElement("button");
        b.className = `px-2.5 py-1 rounded-full font-medium transition cursor-pointer ${
          state.dotsBackdrop === m.id ? "bg-white text-studio-bg" : "text-studio-muted hover:text-white"
        }`;
        b.textContent = m.label;
        b.onclick = () => { state.dotsBackdrop = m.id; renderAll(); };
        controls.appendChild(b);
      });

      const sep = document.createElement("span");
      sep.className = "w-px h-4 bg-studio-border mx-0.5";
      controls.appendChild(sep);

      const rescatter = document.createElement("button");
      rescatter.className = "text-white hover:text-amber-300 font-medium px-2 py-1 rounded-full transition cursor-pointer flex items-center gap-1";
      rescatter.innerHTML = `<span>Re-scatter</span>`;
      rescatter.onclick = () => { state.dotsSeed += 19; renderAll(); };
      controls.appendChild(rescatter);

      board.appendChild(controls);
      container.appendChild(board);
    }

    /**
     * =========================================================================
     * 14. VIEW MODE 6: GRADIENT STRIPS (WITH ACTIVE POSITION ARROWS & SCRUB)
     * =========================================================================
     */
    function renderGradientStripsView(container) {
      const track = document.createElement("div");
      track.className = "w-full h-full flex overflow-x-auto overflow-y-hidden";

      state.slots.forEach((slot, idx) => {
        const hsl = hexToHsl(slot.hex);
        const fg = getContrastText(slot.hex);
        const nameInfo = getClosestColorName(slot.hex);

        // Build vertical perceptual lightness gradient: top = bright tint (L=96%), mid = exact active color at (100-L)%, bottom = deep shade (L=6%)
        const topTint = hslToHex(hsl.h, hsl.s, 96);
        const botShade = hslToHex(hsl.h, hsl.s, 6);
        const stopPct = Math.max(4, Math.min(96, 100 - hsl.l));

        const col = document.createElement("div");
        col.style.flex = "1 0 150px";
        col.style.minWidth = "150px";
        col.style.background = `linear-gradient(to bottom, ${topTint} 0%, ${slot.hex} ${stopPct}%, ${botShade} 100%)`;
        col.className = "h-full relative flex flex-col justify-between items-center py-5 px-2.5 border-r border-black/15 last:border-r-0 group cursor-crosshair";
        col.title = "Click anywhere along gradient to pick shade";

        // Clicking along the vertical gradient picks that exact lightness shade
        col.addEventListener("click", e => {
          if (e.target.closest("button") || e.target.closest("[data-no-scrub]")) return;
          const rect = col.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
          const pickedL = Math.round(96 - ratio * 90);
          const newHex = hslToHex(hsl.h, hsl.s, pickedL);
          updateSlotHex(idx, newHex, true);
        });

        // Subtle Horizontal Marker Line & Dual Arrows showing exact active color position
        const marker = document.createElement("div");
        marker.style.top = `${stopPct}%`;
        marker.style.color = fg;
        marker.className = "absolute left-0 right-0 -translate-y-1/2 pointer-events-none flex items-center justify-between px-1 z-10";
        marker.innerHTML = `

          <svg class="w-3.5 h-3.5 drop-shadow" viewBox="0 0 24 24" fill="currentColor"><polygon points="20,4 4,12 20,20"/></svg>
        `;
        col.appendChild(marker);

        // Top Floating Info Pill (High contrast against top light tint)

        topPill.setAttribute("data-no-scrub", "true");
        topPill.className = "z-20 bg-studio-bar/85 backdrop-blur-md border border-white/10 text-white rounded-xl px-2.5 py-2 text-center shadow-lg w-full max-w-[140px]";
        attachSlotDragHandlers(topPill, idx);

        const hexBtn = document.createElement("button");
        hexBtn.className = "font-mono font-semibold text-xs tracking-wide hover:underline cursor-pointer block mx-auto";
        hexBtn.textContent = slot.hex;
        hexBtn.onclick = e => { e.stopPropagation(); copyTextToClipboard(slot.hex); };

        const nameEl = document.createElement("div");
        nameEl.className = "text-[10px] text-studio-muted truncate mt-0.5";
        nameEl.textContent = nameInfo.label;

        const lumTag = document.createElement("div");
        lumTag.className = "text-[9px] font-mono text-studio-muted/80 mt-0.5";
        lumTag.textContent = `L ${hsl.l}% · H ${hsl.h}°`;

        topPill.appendChild(hexBtn);
        topPill.appendChild(nameEl);
        topPill.appendChild(lumTag);

        // Bottom Controls Pill (High contrast against dark shade)
        const botWrap = document.createElement("div");

        botWrap.appendChild(createSlotControlsBar(idx, "#F8FAFC", false));
