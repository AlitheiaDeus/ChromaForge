          <path data-zone="skin" class="cursor-pointer hover:opacity-95" d="M174 195 L226 195 L234 238 L166 238 Z" fill="${z.skin}" ${strokeAttr}/>
          <path data-zone="skin" class="cursor-pointer hover:opacity-95" d="M114 244 L200 220 L286 244 L304 374 L264 380 L248 292 L248 420 L152 420 L152 292 L136 380 L96 374 Z" fill="${z.skin}" ${strokeAttr}/>

          <!-- Armor Cuirass -->
          <path data-zone="outfit" class="cursor-pointer hover:opacity-95" d="M140 236 L200 268 L260 236 L272 420 L128 420 Z" fill="${z.outfit}" ${strokeAttr}/>

          <!-- Primary Accent Runes / Trim -->
          <path data-zone="accent" class="cursor-pointer hover:opacity-95" d="M152 244 L200 282 L248 244 L238 266 L200 296 L162 266 Z" fill="${z.accent}"/>
          <rect data-zone="accent" class="cursor-pointer hover:opacity-95" x="193" y="292" width="14" height="128" fill="${z.accent}"/>

          <!-- Accessories (Pauldrons, Belt Clasp & Floating Relic) -->
          <rect data-zone="accessories" class="cursor-pointer hover:opacity-95" x="138" y="326" width="124" height="16" fill="${z.accessories}" ${strokeAttr}/>
          <rect data-zone="accessories" class="cursor-pointer hover:opacity-95" x="186" y="319" width="28" height="30" fill="${z.accessories}" ${strokeAttr}/>
          <polygon data-zone="accessories" class="cursor-pointer hover:opacity-95" points="106,246 146,232 138,274 98,266" fill="${z.accessories}" ${strokeAttr}/>
          <polygon data-zone="accessories" class="cursor-pointer hover:opacity-95" points="294,246 254,232 262,274 302,266" fill="${z.accessories}" ${strokeAttr}/>
          <polygon data-zone="accessories" class="cursor-pointer hover:opacity-95" points="334,152 350,180 334,208 318,180" fill="${z.accessories}" ${strokeAttr}/>

          <!-- Head Silhouette (Skin) -->
          <path data-zone="skin" class="cursor-pointer hover:opacity-95" d="M146 132 L162 92 L238 92 L254 132 L242 188 L200 206 L158 188 Z" fill="${z.skin}" ${strokeAttr}/>

          <!-- Cheek Tattoos / Markings (Accent) -->
          <polygon data-zone="accent" class="cursor-pointer" points="152,160 172,166 156,174" fill="${z.accent}"/>
          <polygon data-zone="accent" class="cursor-pointer" points="248,160 228,166 244,174" fill="${z.accent}"/>

          <!-- Crest / Horns -->
          ${headCrestSVG}

          <!-- Left Eye: eyeoutL & eyeinL -->
          <polygon data-zone="eyeoutL" class="cursor-pointer" points="158,146 175,137 192,146 175,156" fill="${z.eyeoutL}" ${strokeAttr}/>
          <circle data-zone="eyeinL" class="cursor-pointer" cx="175" cy="146.5" r="5.5" fill="${z.eyeinL}"/>

          <!-- Right Eye: eyeoutR & eyeinR -->
          <polygon data-zone="eyeoutR" class="cursor-pointer" points="208,146 225,137 242,146 225,156" fill="${z.eyeoutR}" ${strokeAttr}/>
          <circle data-zone="eyeinR" class="cursor-pointer" cx="225" cy="146.5" r="5.5" fill="${z.eyeinR}"/>

          <!-- Mouth -->
          <polygon data-zone="mouth" class="cursor-pointer" points="180,178 200,184 220,178 214,189 200,192 186,189" fill="${z.mouth}"/>
        </svg>
      `;

      // Clicking any anatomical region opens the color picker for that slot and highlights it in the bottom strip
      svgContainer.querySelectorAll("[data-zone]").forEach(el => {
        const zoneKey = el.getAttribute("data-zone");
        const slotIdx = zSlotIdx[zoneKey];
        const zoneObj = CREATURE_ZONES.find(item => item.key === zoneKey);
        el.innerHTML += `<title>${zoneObj ? zoneObj.label : zoneKey}: ${slots[slotIdx].hex} (Click to edit Color ${slotIdx + 1})</title>`;
        el.addEventListener("click", e => {
          e.stopPropagation();
          highlightBottomSlot(slotIdx, true);
        });
      });

      // If N > 11, render extra colors as orbiting orbs around the silhouette
      if (n > 11) {
        for (let i = 11; i < n; i++) {
          const angle = ((i - 11) / (n - 11)) * Math.PI * 2 - Math.PI / 2;
          const rx = 44 * Math.cos(angle) + 50;
          const ry = 42 * Math.sin(angle) + 50;
          const orb = document.createElement("button");
          orb.style.left = `${rx}%`;
          orb.style.top = `${ry}%`;
          orb.style.backgroundColor = slots[i].hex;
          orb.className = `absolute -translate-x-1/2 -translate-y-1/2 w-7 h-7 rounded-full shadow-lg cursor-pointer hover:scale-125 transition ${
            state.seamless ? "" : "border-2 border-basalt"
          }`;
          orb.title = `Color ${i + 1}: ${slots[i].hex}`;
          orb.onclick = () => highlightBottomSlot(i, true);
          svgContainer.appendChild(orb);
        }
      }

      stageWrap.appendChild(svgContainer);
      container.appendChild(stageWrap);
    }

    /**
     * =========================================================================
     * 16. BOTTOM ACTIVE PALETTE DOCK (FOR FULL-CANVAS MODES)
     * =========================================================================
     */
    function renderBottomPaletteDock() {
      const dock = document.getElementById("bottom-palette-dock");
      const showDock = ["mosaic", "dots", "ui", "creature"].includes(state.view);
      if (!showDock) {
        dock.classList.add("hidden");
        return;
      }
      dock.classList.remove("hidden");
      dock.innerHTML = "";

      const uiRoleNames = ["BG", "BG Accent", "Text", "Urgent", "Panel", "Hover", "Button", "Muted", "Border", "Accent 2"];

      state.slots.forEach((slot, idx) => {
        const fg = getContrastText(slot.hex);
        const isHighlighted = state.highlightedSlotIndex === idx;

        const cell = document.createElement("div");
        cell.style.backgroundColor = slot.hex;
        cell.style.color = fg;
        cell.className = `flex-1 h-full flex items-center justify-between px-2 relative group cursor-pointer transition-all ${
          state.seamless ? "" : "border-r border-chisel"
        } ${isHighlighted ? "ring-2 ring-inset ring-whitehot z-10" : ""}`;
        attachSlotDragHandlers(cell, idx);

        let roleSub = "";
        if (state.view === "ui" && idx < uiRoleNames.length) {
          roleSub = uiRoleNames[idx];
        } else if (state.view === "creature" && idx < CREATURE_ZONES.length) {
          roleSub = CREATURE_ZONES[idx].label;
        }

        const left = document.createElement("div");
        left.className = "min-w-0 flex flex-col";
        left.innerHTML = `
          <span class="font-mono font-bold text-[11px] truncate">${slot.locked ? "🔒 " : ""}${slot.hex}</span>
          ${roleSub ? `<span class="text-[9px] opacity-80 truncate">${roleSub}</span>` : ""}
        `;
        cell.appendChild(left);

        const actions = document.createElement("div");
        actions.className = "opacity-0 group-hover:opacity-100 transition-opacity shrink-0";
        actions.appendChild(createSlotControlsBar(idx, true));
        cell.appendChild(actions);

        cell.addEventListener("click", e => {
          if (e.target.closest("button")) return;
          openColorPopover(idx, cell);
        });

        dock.appendChild(cell);
      });
    }

    function highlightBottomSlot(index, openPicker = false) {
      state.highlightedSlotIndex = index;
      renderBottomPaletteDock();
      const dock = document.getElementById("bottom-palette-dock");
      const targetCell = dock.children[index];
      if (targetCell && openPicker) {
        openColorPopover(index, targetCell);
      } else if (state.slots[index]) {
        const nameInfo = getClosestColorName(state.slots[index].hex);
        showToast(`Color ${index + 1}: ${state.slots[index].hex}${nameInfo.label ? " (" + nameInfo.label + ")" : ""}`, state.slots[index].hex);
      }
    }

    /**
     * =========================================================================
     * 17. PINNED COLORS TRAY & SAVE/LOAD DRAWER
     * =========================================================================
     */
    function renderPinnedDock() {
      const list = document.getElementById("pinned-list");
      const countBadge = document.getElementById("pinned-count");
      const loadBtn = document.getElementById("btn-load-pinned-to-active");
      const clearBtn = document.getElementById("btn-clear-pinned");

      countBadge.textContent = String(state.pinned.length);
      list.innerHTML = "";

      if (state.pinned.length === 0) {
        list.innerHTML = `<span class="text-[11px] text-cinder/75">Click the pin icon on any color to save it here across rolls.</span>`;
        loadBtn.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      loadBtn.classList.remove("hidden");
      clearBtn.classList.remove("hidden");

      state.pinned.forEach(hex => {
        const nameInfo = getClosestColorName(hex);
        const chip = document.createElement("div");
        chip.setAttribute("draggable", "true");
        chip.addEventListener("dragstart", e => {
          e.dataTransfer.setData("text/pinned-hex", hex);
        });
        chip.title = `${hex}${nameInfo.label ? " (" + nameInfo.label + ")" : ""} — Click to copy, drag onto any slot, or click + to apply`;
        chip.className = "flex items-center gap-1.5 bg-slab border border-chisel pl-1.5 pr-1 py-0.5 text-[11px] font-mono rounded-sm shrink-0 cursor-grab";

        const dot = document.createElement("span");
        dot.style.backgroundColor = hex;
        dot.className = "w-3.5 h-3.5 border border-white/20 cursor-pointer";
        dot.onclick = () => copyTextToClipboard(hex);

        const label = document.createElement("button");
        label.className = "text-ash hover:text-whitehot cursor-pointer font-semibold";
        label.textContent = hex;
        label.onclick = () => copyTextToClipboard(hex);

        const applyBtn = document.createElement("button");
        applyBtn.className = "text-cinder hover:text-whitehot px-1 cursor-pointer font-bold";
        applyBtn.title = "Apply to unlocked slot";
        applyBtn.textContent = "+";
        applyBtn.onclick = () => applyPinnedToSlot(hex);

        const delBtn = document.createElement("button");
        delBtn.className = "text-cinder hover:text-red-400 px-1 cursor-pointer";
        delBtn.title = "Remove pin";
        delBtn.textContent = "×";
        delBtn.onclick = () => unpinColor(hex);

        chip.appendChild(dot);
        chip.appendChild(label);
        chip.appendChild(applyBtn);
        chip.appendChild(delBtn);
        list.appendChild(chip);
      });
    }

    function loadSavedFromStorage() {
      try {
        const rawSaved = localStorage.getItem(STORAGE_KEY_SAVED);
        if (rawSaved) state.savedLibraries = JSON.parse(rawSaved);
        const rawPinned = localStorage.getItem(STORAGE_KEY_PINNED);
        if (rawPinned) state.pinned = JSON.parse(rawPinned);
      } catch (e) {}
    }

    function saveLibraryToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_SAVED, JSON.stringify(state.savedLibraries));
      } catch (e) {}
    }

    function savePinnedToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_PINNED, JSON.stringify(state.pinned));
      } catch (e) {}
    }

    function renderDrawerContents() {
      document.getElementById("drawer-active-count").textContent = `${state.slots.length} colors`;
      document.getElementById("drawer-pinned-count").textContent = `${state.pinned.length} pinned`;

      const savedList = document.getElementById("saved-palettes-list");
      savedList.innerHTML = "";

      if (state.savedLibraries.length === 0) {
        savedList.innerHTML = `<div class="text-cinder text-[11px] carved-recess p-3 text-center">No saved palettes yet.</div>`;
      } else {
        state.savedLibraries.forEach(item => {
          const card = document.createElement("div");
          card.className = "carved-recess p-3 space-y-2 rounded-sm";

          const top = document.createElement("div");
          top.className = "flex items-center justify-between gap-2";
          top.innerHTML = `
            <div class="min-w-0">
              <div class="font-semibold text-ash truncate">${item.name}</div>
              <div class="text-[10px] font-mono text-cinder">${item.colors.length} colors</div>
            </div>
          `;

          const actions = document.createElement("div");
          actions.className = "flex items-center gap-1 shrink-0";

          const loadActiveBtn = document.createElement("button");
          loadActiveBtn.className = "forge-btn px-2 py-1 text-[11px] text-whitehot rounded-sm";
          loadActiveBtn.textContent = "Load";
          loadActiveBtn.onclick = () => {
            loadColorsIntoActive(item.colors);
            closeDrawer();
            showToast(`Loaded "${item.name}"`);
          };

          const loadPinsBtn = document.createElement("button");
          loadPinsBtn.className = "forge-btn px-2 py-1 text-[11px] rounded-sm";
          loadPinsBtn.textContent = "Pin All";
          loadPinsBtn.onclick = () => {
            state.pinned = [...new Set([...state.pinned, ...item.colors])];
            savePinnedToStorage();
            document.getElementById("pinned-tray").classList.remove("hidden");
            renderPinnedDock();
            showToast(`Pinned ${item.colors.length} colors`);
          };

          const delBtn = document.createElement("button");
          delBtn.className = "forge-btn px-2 py-1 text-[11px] text-cinder hover:text-red-400 rounded-sm";
          delBtn.textContent = "✕";
          delBtn.onclick = () => {
            state.savedLibraries = state.savedLibraries.filter(x => x.id !== item.id);
            saveLibraryToStorage();
            renderDrawerContents();
          };

          actions.appendChild(loadActiveBtn);
          actions.appendChild(loadPinsBtn);
          actions.appendChild(delBtn);
          top.appendChild(actions);

          const strip = document.createElement("div");
          strip.className = "h-5 flex overflow-hidden rounded-sm";
          item.colors.forEach(c => {
            const seg = document.createElement("div");
            seg.style.backgroundColor = c;
            seg.className = "flex-1 h-full";
            strip.appendChild(seg);
          });

          card.appendChild(top);
          card.appendChild(strip);
          savedList.appendChild(card);
        });
      }

      const starterList = document.getElementById("starter-palettes-list");
      starterList.innerHTML = "";
      STARTER_PALETTES.forEach(sp => {
        const card = document.createElement("div");
        card.className = "carved-recess p-3 space-y-2 hover:border-magma transition cursor-pointer rounded-sm";
        card.onclick = () => {
          loadColorsIntoActive(sp.colors);
          closeDrawer();
          showToast(`Loaded "${sp.name}"`);
        };
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-medium text-ash">${sp.name}</span>
            <span class="text-[11px] font-mono text-amber-300">Load</span>
          </div>
          <div class="h-4 flex overflow-hidden rounded-sm">
            ${sp.colors.map(c => `<div style="background:${c}" class="flex-1 h-full"></div>`).join("")}
          </div>
        `;
        starterList.appendChild(card);
      });
    }

    function loadColorsIntoActive(hexArray) {
      const valid = hexArray.map(normalizeHex).filter(Boolean).slice(0, 24);
      if (valid.length === 0) return;
      state.slots = valid.map(hex => ({
        id: nextSlotId(),
        hex,
        locked: false
      }));
      pushHistory();
      renderAll();
    }

    function openDrawer() {
      renderDrawerContents();
      document.getElementById("drawer-backdrop").classList.remove("hidden");
      document.getElementById("palettes-drawer").classList.remove("translate-x-full");
    }

    function closeDrawer() {
      document.getElementById("drawer-backdrop").classList.add("hidden");
      document.getElementById("palettes-drawer").classList.add("translate-x-full");
    }

    /**
     * =========================================================================
     * 18. VIEW SWITCHER & FLOATING CONTEXT CONTROLS
     * =========================================================================
     */
    function renderViewSwitcher() {
      const nav = document.getElementById("view-switcher");
      nav.innerHTML = "";
      VIEW_MODES.forEach(mode => {
        const btn = document.createElement("button");
        const active = state.view === mode.id;
        btn.className = `forge-btn px-2.5 py-1 text-xs font-medium rounded-sm whitespace-nowrap ${
          active ? "forge-btn-active" : "text-cinder"
        }`;
        btn.textContent = mode.label;
        btn.onclick = () => {
          state.view = mode.id;
          renderViewSwitcher();
          renderAuxControls();
          renderStage();
          renderBottomPaletteDock();
        };
        nav.appendChild(btn);
      });
    }

    function renderAuxControls() {
      const aux = document.getElementById("mode-aux-controls");
      aux.innerHTML = "";

      if (state.view === "mosaic") {
        aux.classList.remove("hidden");

        // Density Slider (80..500 shards)
        const densWrap = document.createElement("div");
        densWrap.className = "flex items-center gap-2";
        densWrap.innerHTML = `
          <span class="text-cinder">Shards:</span>
          <input type="range" min="80" max="500" step="20" value="${state.mosaicCount}" class="forge-slider w-24" id="mosaic-density-slider" />
          <span class="font-mono text-whitehot w-8" id="mosaic-density-val">${state.mosaicCount}</span>
        `;
        aux.appendChild(densWrap);

        // Cluster Slider (0..100%)
        const clustWrap = document.createElement("div");
        clustWrap.className = "flex items-center gap-2";
        clustWrap.innerHTML = `
          <span class="text-cinder">Cluster:</span>
          <input type="range" min="0" max="90" step="10" value="${state.mosaicCluster}" class="forge-slider w-20" id="mosaic-cluster-slider" />
        `;
        aux.appendChild(clustWrap);

        // Re-roll Pattern Button
        const rerollBtn = document.createElement("button");
        rerollBtn.className = "forge-btn px-2.5 py-1 text-xs rounded-sm text-whitehot";
        rerollBtn.textContent = "Re-roll Pattern";
        rerollBtn.onclick = () => { state.mosaicSeed += 17; renderStage(); };
        aux.appendChild(rerollBtn);

        setTimeout(() => {
          const dSlider = document.getElementById("mosaic-density-slider");
          const cSlider = document.getElementById("mosaic-cluster-slider");
          if (dSlider) {
            dSlider.addEventListener("input", e => {
              state.mosaicCount = parseInt(e.target.value, 10);
              document.getElementById("mosaic-density-val").textContent = state.mosaicCount;
              renderStage();
            });
          }
          if (cSlider) {
            cSlider.addEventListener("input", e => {
              state.mosaicCluster = parseInt(e.target.value, 10);
              renderStage();
            });
          }
        }, 0);

      } else if (state.view === "dots") {
        aux.classList.remove("hidden");

        // Dot Count Slider (150..800)
        const countWrap = document.createElement("div");
        countWrap.className = "flex items-center gap-2";
        countWrap.innerHTML = `
          <span class="text-cinder">Dots:</span>
          <input type="range" min="150" max="800" step="50" value="${state.dotsCount}" class="forge-slider w-24" id="dots-count-slider" />
          <span class="font-mono text-whitehot w-8" id="dots-count-val">${state.dotsCount}</span>
        `;
        aux.appendChild(countWrap);

        // Size Variance Toggle
        const sizeBtn = document.createElement("button");
        sizeBtn.className = `forge-btn px-2 py-1 text-xs rounded-sm ${state.dotsVariedSize ? "forge-btn-active" : ""}`;
        sizeBtn.textContent = state.dotsVariedSize ? "Size: Varied" : "Size: Uniform";
        sizeBtn.onclick = () => {
          state.dotsVariedSize = !state.dotsVariedSize;
          renderAuxControls();
          renderStage();
        };
        aux.appendChild(sizeBtn);

        // Backdrop Selector
        const backdrops = [
          { id: "dark", label: "Dark" },
          { id: "gray", label: "Gray" },
          { id: "light", label: "Light" },
          { id: "slot1", label: "Color 1" }
        ];
        backdrops.forEach(b => {
          const btn = document.createElement("button");
          btn.className = `forge-btn px-2 py-1 text-xs rounded-sm ${
            state.dotsBackdrop === b.id ? "forge-btn-active" : "text-cinder"
          }`;
          btn.textContent = b.label;
          btn.onclick = () => { state.dotsBackdrop = b.id; renderAuxControls(); renderStage(); };
          aux.appendChild(btn);
        });

        const rescatter = document.createElement("button");
        rescatter.className = "forge-btn px-2.5 py-1 text-xs rounded-sm text-whitehot";
        rescatter.textContent = "Re-scatter";
        rescatter.onclick = () => { state.dotsSeed += 23; renderStage(); };
        aux.appendChild(rescatter);

        setTimeout(() => {
          const s = document.getElementById("dots-count-slider");
          if (s) {
            s.addEventListener("input", e => {
              state.dotsCount = parseInt(e.target.value, 10);
              document.getElementById("dots-count-val").textContent = state.dotsCount;
              renderStage();
            });
          }
        }, 0);

      } else if (state.view === "ui") {
        aux.classList.remove("hidden");
        const rotBtn = document.createElement("button");
        rotBtn.className = "forge-btn px-3 py-1 text-xs rounded-sm text-whitehot";
        rotBtn.textContent = "Rotate Role Mapping";
        rotBtn.onclick = () => rotateSlots();
        aux.appendChild(rotBtn);

      } else if (state.view === "creature") {
        aux.classList.remove("hidden");
        const archetypes = [
          { id: "titan", label: "Titan" },
          { id: "wraith", label: "Wraith" },
          { id: "construct", label: "Construct" }
        ];
        archetypes.forEach(a => {
          const btn = document.createElement("button");
          btn.className = `forge-btn px-2.5 py-1 text-xs rounded-sm ${
            state.creatureArchetype === a.id ? "forge-btn-active" : "text-cinder"
          }`;
          btn.textContent = a.label;
          btn.onclick = () => { state.creatureArchetype = a.id; renderAuxControls(); renderStage(); };
          aux.appendChild(btn);
        });

        const rotBtn = document.createElement("button");
        rotBtn.className = "forge-btn px-2.5 py-1 text-xs rounded-sm text-whitehot";
        rotBtn.textContent = "Rotate Zones";
        rotBtn.onclick = () => rotateSlots();
        aux.appendChild(rotBtn);

      } else {
        aux.classList.add("hidden");
      }
    }

    function renderStage() {
      const stage = document.getElementById("stage");
      stage.innerHTML = "";

      switch (state.view) {
        case "grid": renderGridView(stage); break;
        case "mosaic": renderMosaicView(stage); break;
        case "ui": renderUiMockupView(stage); break;
        case "dots": renderScatteredDotsView(stage); break;
        case "strips": renderStripsView(stage); break;
        case "gradients": renderGradientStripsView(stage); break;
        case "creature": renderCreatureView(stage); break;
      }
    }

    function renderAll() {
      document.getElementById("count-display").textContent = String(state.slots.length);
      document.getElementById("btn-count-dec").disabled = state.slots.length <= 2;
      document.getElementById("btn-count-inc").disabled = state.slots.length >= 24;

      // Sync Seamless / Framed button active states
      document.getElementById("btn-mode-seamless").classList.toggle("forge-btn-active", state.seamless);
      document.getElementById("btn-mode-framed").classList.toggle("forge-btn-active", !state.seamless);

      // Sync Labels button text
      const labelMap = { hover: "Hover", always: "Always", off: "Off" };
      document.getElementById("labels-state-text").textContent = labelMap[state.labelMode];

      renderPinnedDock();
      renderAuxControls();
      renderStage();
      renderBottomPaletteDock();
    }

    function initApp() {
      forgeFx.init();
      loadSavedFromStorage();

      // Start with 6 full-spectrum generated colors
      state.slots = Array.from({ length: 6 }, () => ({
        id: nextSlotId(),
        hex: "#000000",
        locked: false
      }));
      generatePalette(true, false);

      renderViewSwitcher();
      bindPopoverEvents();
      renderAll();

      // Top Bar Controls
      document.getElementById("btn-generate").addEventListener("click", () => generatePalette(true, true));
      document.getElementById("btn-undo").addEventListener("click", undo);
      document.getElementById("btn-redo").addEventListener("click", redo);
      document.getElementById("btn-count-dec").addEventListener("click", () => setPaletteCount(state.slots.length - 1));
      document.getElementById("btn-count-inc").addEventListener("click", () => setPaletteCount(state.slots.length + 1));

      document.getElementById("btn-mode-seamless").addEventListener("click", () => {
        state.seamless = true;
        renderAll();
      });
      document.getElementById("btn-mode-framed").addEventListener("click", () => {
        state.seamless = false;
        renderAll();
      });

      document.getElementById("btn-toggle-labels").addEventListener("click", () => {
        const order = ["hover", "always", "off"];
        state.labelMode = order[(order.indexOf(state.labelMode) + 1) % order.length];
        renderAll();
      });

      document.getElementById("guard-select").addEventListener("change", e => {
        state.baseDeltaE = parseInt(e.target.value, 10);
      });

      document.getElementById("btn-toggle-pins").addEventListener("click", () => {
        document.getElementById("pinned-tray").classList.toggle("hidden");
      });

      // Pinned Tray Actions
      document.getElementById("btn-pin-all-active").addEventListener("click", () => {
        state.slots.forEach(s => {
          if (!state.pinned.includes(s.hex)) state.pinned.push(s.hex);
        });
        savePinnedToStorage();
        renderPinnedDock();
        showToast("Pinned current palette");
      });

      document.getElementById("btn-load-pinned-to-active").addEventListener("click", () => {
        if (state.pinned.length === 0) return;
        loadColorsIntoActive(state.pinned);
        showToast("Loaded pinned colors as active palette");
      });

      document.getElementById("btn-clear-pinned").addEventListener("click", () => {
        state.pinned = [];
        savePinnedToStorage();
        renderPinnedDock();
        showToast("Cleared pinned colors");
      });

      // Save / Load Drawer
      document.getElementById("btn-open-drawer").addEventListener("click", openDrawer);
      document.getElementById("btn-close-drawer").addEventListener("click", closeDrawer);
      document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);

      document.getElementById("btn-save-active").addEventListener("click", () => {
        const input = document.getElementById("save-active-name");
        const name = input.value.trim() || `Palette (${state.slots.length} colors)`;
        state.savedLibraries.unshift({
          id: Date.now().toString(),
          name,
          type: "palette",
          colors: state.slots.map(s => s.hex)
        });
        input.value = "";
        saveLibraryToStorage();
        renderDrawerContents();
        showToast(`Saved "${name}"`);
      });

      document.getElementById("btn-save-pinned").addEventListener("click", () => {
        if (state.pinned.length === 0) {
          showToast("Pin at least 1 color first");
          return;
        }
        const input = document.getElementById("save-pinned-name");
        const name = input.value.trim() || `Pinned (${state.pinned.length} colors)`;
        state.savedLibraries.unshift({
          id: Date.now().toString(),
          name,
          type: "pinned",
          colors: [...state.pinned]
        });
        input.value = "";
        saveLibraryToStorage();
        renderDrawerContents();
        showToast(`Saved "${name}"`);
      });

      document.getElementById("btn-export-css").addEventListener("click", () => {
        const css = `:root {\n${state.slots.map((s, i) => {
          const nInfo = getClosestColorName(s.hex);
          return `  --color-${i + 1}: ${s.hex};${nInfo.label ? ` /* ${nInfo.label} */` : ""}`;
        }).join("\n")}\n}`;
        copyTextToClipboard(css, "Copied CSS variables");
      });

      document.getElementById("btn-export-json").addEventListener("click", () => {
        const json = JSON.stringify(state.slots.map(s => s.hex));
        copyTextToClipboard(json, "Copied HEX JSON");
      });

      document.getElementById("btn-import-json").addEventListener("click", () => {
        const raw = document.getElementById("import-json-input").value.trim();
        if (!raw) return;
        const matches = raw.match(/#?[0-9A-Fa-f]{6}\b/g);
        if (!matches || matches.length === 0) {
          showToast("No valid HEX codes found");
          return;
        }
        loadColorsIntoActive(matches);
        document.getElementById("import-json-input").value = "";
        closeDrawer();
        showToast(`Imported ${Math.min(24, matches.length)} colors`);
      });

      // Keyboard Shortcuts
      document.addEventListener("keydown", e => {
        const tag = document.activeElement?.tagName;
        const isTyping = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
          if (isTyping) return;
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
          if (isTyping) return;
          e.preventDefault();
          redo();
          return;
        }
        if (e.code === "Space" && !isTyping) {
          e.preventDefault();
          generatePalette(true, true);
        } else if (e.key.toLowerCase() === "h" && !isTyping) {
          const order = ["hover", "always", "off"];
          state.labelMode = order[(order.indexOf(state.labelMode) + 1) % order.length];
          renderAll();
        } else if (e.key === "Escape") {
          closePopover();
          closeDrawer();
        }
      });

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (["grid", "mosaic", "dots"].includes(state.view)) {
            renderStage();
          }
        }, 100);
      });
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
