<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Palette Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Cinzel"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            basalt: '#0B090A',
            cavern: '#120E0D',
            slab: '#191311',
            chisel: '#2C201B',
            bronze: '#4A3325',
            ash: '#F3EDE4',
            cinder: '#A69588',
            magma: '#EA580C',
            whitehot: '#FEF08A',
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #0B090A;
      color: #F3EDE4;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100%;
    }

    /* Subtle Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #0B090A;
    }
    ::-webkit-scrollbar-thumb {
      background: #2C201B;
      border: 1px solid #4A3325;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #EA580C;
    }

    /* Carved Dark Basalt Stone Slabs */
    .basalt-slab {
      background: linear-gradient(180deg, #1C1513 0%, #130E0D 100%);
      border-top: 1px solid rgba(255, 190, 110, 0.16);
      border-bottom: 2px solid #050404;
      box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.06), 0 6px 20px rgba(0, 0, 0, 0.75);
      position: relative;
    }

    .carved-recess {
      background-color: #0D0A09;
      border: 1px solid #2A1E19;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 180, 100, 0.07);
    }

    /* Chiseled Stone Buttons */
    .forge-btn {
      background: linear-gradient(180deg, #241B18 0%, #17110F 100%);
      color: #E7DFD5;
      border: 1px solid #3A281E;
      border-top-color: rgba(255, 195, 120, 0.22);
      border-bottom: 2px solid #070505;
      box-shadow: 0 2px 0 #050404;
      transition: all 0.1s ease;
      cursor: pointer;
    }
    .forge-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #2F231E 0%, #1F1714 100%);
      border-color: #6E4730;
      color: #FFFFFF;
      box-shadow: 0 2px 0 #050404, 0 0 10px rgba(234, 88, 12, 0.2);
    }
    .forge-btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #050404;
    }
    .forge-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Active Mode / Toggle Button State */
    .forge-btn-active {
      background: linear-gradient(180deg, #331C12 0%, #1F100A 100%) !important;
      border-color: #EA580C !important;
      border-top-color: #FDBA74 !important;
      color: #FEF08A !important;
      box-shadow: inset 0 0 10px rgba(234, 88, 12, 0.35), 0 1px 0 #050404 !important;
    }

    /* White-Hot Metal Billet Generate Button */
    .whitehot-btn {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF08A 24%, #FB923C 62%, #EA580C 100%);
      color: #140B07;
      font-weight: 700;
      border: 1px solid #FFFBEB;
      border-bottom: 2px solid #9A3412;
      box-shadow:
        0 3px 0 #2A0F05,
        0 0 18px rgba(251, 146, 60, 0.55),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
      transition: transform 0.07s ease, box-shadow 0.15s ease, filter 0.15s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .whitehot-btn:hover {
      filter: brightness(1.07);
      box-shadow:
        0 3px 0 #2A0F05,
        0 0 26px rgba(254, 240, 138, 0.8),
        0 0 42px rgba(234, 88, 12, 0.55),
        inset 0 1px 3px #FFFFFF;
    }
    .whitehot-btn:active, .whitehot-btn.anvil-struck {
      transform: translateY(2px) scale(0.985);
      box-shadow:
        0 1px 0 #2A0F05,
        0 0 34px rgba(255, 255, 255, 0.95),
        0 0 60px rgba(249, 115, 22, 0.9);
    }

    /* Anvil Strike Frame Flash */
    @keyframes anvilFlash {
      0% {
        box-shadow: inset 0 0 0 2px #FFFBEB, inset 0 0 38px rgba(254, 240, 138, 0.65);
      }
      100% {
        box-shadow: inset 0 0 0 0 transparent, inset 0 0 0 transparent;
      }
    }
    .strike-flash {
      animation: anvilFlash 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Ambient Lava Lake Underglow at Bottom of Viewport */
    .lava-underglow {
      background: radial-gradient(ellipse 80% 55% at 50% 105%, rgba(234, 88, 12, 0.22) 0%, rgba(154, 52, 18, 0.08) 50%, transparent 80%);
    }

    /* Range Sliders */
    input[type="range"].forge-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      outline: none;
      cursor: pointer;
      border: 1px solid #3A281E;
      background: #0D0A09;
      border-radius: 2px;
    }
    input[type="range"].forge-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 18px;
      background: linear-gradient(180deg, #FEF08A 0%, #EA580C 100%);
      border: 1px solid #FFFBEB;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      cursor: pointer;
      border-radius: 1px;
    }
    input[type="range"].forge-slider::-moz-range-thumb {
      width: 14px;
      height: 18px;
      background: linear-gradient(180deg, #FEF08A 0%, #EA580C 100%);
      border: 1px solid #FFFBEB;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      cursor: pointer;
      border-radius: 1px;
    }

    /* Drag & Drop Target Outline */
    .drag-over-target {
      outline: 2px dashed #FEF08A !important;
      outline-offset: -4px;
      z-index: 30;
    }

    /* Panning Cursors */
    .pan-grab {
      cursor: grab;
    }
    .pan-grabbing {
      cursor: grabbing !important;
      user-select: none;
    }
  </style>
</head>
<body class="flex flex-col h-screen select-none bg-basalt text-ash relative">

  <!-- Ambient Cavern Ember & Spark Canvas (Background + Anvil Strike Sparks) -->
  <canvas id="forge-fx-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- ===================================================================== -->
  <!-- 1. TOP CONTROL BAR (PLAIN LABELS, NO GIMMICK METAPHORS)               -->
  <!-- ===================================================================== -->
  <header class="basalt-slab px-3 py-2 flex flex-wrap items-center justify-between gap-2 z-30 shrink-0">
    <!-- Left: Generate + Color Count + Seamless/Framed + Undo/Redo -->
    <div class="flex flex-wrap items-center gap-2">
      <!-- Primary White-Hot Metal Generate Button -->
      <button id="btn-generate" title="Generate new unlocked colors (Spacebar)"
        class="whitehot-btn px-4 py-1.5 rounded-sm text-xs uppercase tracking-wider flex items-center gap-2">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
        </svg>
        <span>Generate</span>
        <kbd class="hidden sm:inline-block text-[10px] font-mono bg-black/25 text-black px-1.5 py-0.2 rounded-sm font-semibold">Space</kbd>
      </button>

      <!-- Colors Count (- / +) -->
      <div class="flex items-center carved-recess px-1 py-0.5 rounded-sm" title="Number of Colors (2–24)">
        <span class="text-[11px] text-cinder px-2 hidden sm:inline">Colors</span>
        <button id="btn-count-dec" aria-label="Decrease color count"
          class="forge-btn w-6 h-6 flex items-center justify-center font-mono font-bold text-xs rounded-sm">
          -
        </button>
        <div id="count-display" class="px-2.5 text-xs font-mono font-bold text-whitehot min-w-[2.1rem] text-center">
          6
        </div>
        <button id="btn-count-inc" aria-label="Increase color count"
          class="forge-btn w-6 h-6 flex items-center justify-center font-mono font-bold text-xs rounded-sm">
          +
        </button>
      </div>

      <!-- Seamless vs Framed Toggle (Defaults to Seamless) -->
      <div class="flex items-center carved-recess p-0.5 rounded-sm" title="Toggle between gapless/borderless tiles or framed tiles">
        <button id="btn-mode-seamless" class="forge-btn forge-btn-active px-2.5 py-1 text-xs font-medium rounded-sm">
          Seamless
        </button>
        <button id="btn-mode-framed" class="forge-btn px-2.5 py-1 text-xs font-medium rounded-sm">
          Framed
        </button>
      </div>

      <!-- Labels Visibility Toggle -->
      <button id="btn-toggle-labels" title="Toggle text overlays on swatches (Shortcut: H)"
        class="forge-btn px-2.5 py-1 text-xs font-medium rounded-sm flex items-center gap-1.5">
        <span>Labels:</span>
        <span id="labels-state-text" class="font-mono text-whitehot">Hover</span>
      </button>

      <!-- Undo / Redo -->
      <div class="flex items-center gap-1">
        <button id="btn-undo" title="Undo (Ctrl+Z)" disabled
          class="forge-btn px-2.5 py-1 text-xs rounded-sm flex items-center gap-1">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
          </svg>
          <span class="hidden xl:inline">Undo</span>
        </button>
        <button id="btn-redo" title="Redo (Ctrl+Y)" disabled
          class="forge-btn px-2.5 py-1 text-xs rounded-sm flex items-center gap-1">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
          </svg>
          <span class="hidden xl:inline">Redo</span>
        </button>
      </div>
    </div>

    <!-- Center: 7 View Modes -->
    <nav id="view-switcher" aria-label="View Modes" class="flex flex-wrap items-center gap-1">
      <!-- Populated dynamically -->
    </nav>

    <!-- Right: Similarity Guard + Pinned Tray Toggle + Save / Load -->
    <div class="flex flex-wrap items-center gap-2">
      <!-- Perceptual Similarity Guard -->
      <div class="carved-recess px-2 py-1 rounded-sm flex items-center gap-1.5 text-xs" title="Prevent auto-generating colors that are too similar">
        <span class="text-cinder hidden md:inline">Guard:</span>
        <select id="guard-select" class="bg-transparent text-ash font-mono text-xs focus:outline-none cursor-pointer">
          <option value="26" class="bg-slab text-ash">Strict</option>
          <option value="20" selected class="bg-slab text-ash">Normal</option>
          <option value="12" class="bg-slab text-ash">Relaxed</option>
          <option value="0" class="bg-slab text-ash">Off</option>
        </select>
      </div>

      <!-- Pinned Colors Bar Toggle -->
      <button id="btn-toggle-pins" title="Toggle Pinned Colors tray"
        class="forge-btn px-2.5 py-1 text-xs rounded-sm flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-magma" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 3H8v6l-2 4v2h5v6h2v-6h5v-2l-2-4V3z"/>
        </svg>
        <span>Pinned</span>
        <span id="pinned-count" class="font-mono text-[11px] bg-basalt px-1.5 py-0.2 rounded-sm text-whitehot">0</span>
      </button>

      <!-- Save / Load Modal Trigger -->
      <button id="btn-open-drawer"
        class="forge-btn px-3 py-1 text-xs font-medium rounded-sm flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span>Save / Load</span>
      </button>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- 2. COLLAPSIBLE PINNED COLORS BAR (EXTERNAL PALETTE)                   -->
  <!-- ===================================================================== -->
  <section id="pinned-tray" class="hidden bg-cavern border-b border-chisel px-3 py-1.5 flex items-center justify-between gap-3 shrink-0 z-20">
    <div class="flex items-center gap-2 overflow-x-auto py-0.5 flex-1 min-w-0">
      <span class="text-xs font-medium text-cinder shrink-0">Pinned Colors:</span>
      <div id="pinned-list" class="flex items-center gap-1.5">
        <!-- Pinned Swatches Injected Here -->
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-pin-all-active" title="Pin all current colors"
        class="forge-btn text-[11px] px-2.5 py-1 rounded-sm">
        Pin Current Palette
      </button>
      <button id="btn-load-pinned-to-active" title="Replace active palette with pinned colors"
        class="forge-btn text-[11px] px-2.5 py-1 rounded-sm text-whitehot hidden">
        Use as Active Palette
      </button>
      <button id="btn-clear-pinned" title="Clear all pinned colors"
        class="forge-btn text-[11px] px-2.5 py-1 rounded-sm text-cinder hover:text-red-400 hidden">
        Clear
      </button>
    </div>
  </section>

  <!-- ===================================================================== -->
  <!-- 3. MAIN VIEWPORT STAGE + FLOATING MODE CONTROLS + BOTTOM STRIP        -->
  <!-- ===================================================================== -->
  <main id="main-frame" class="flex-1 relative overflow-hidden flex flex-col lava-underglow">
    <!-- Floating Auxiliary Controls for Mosaic / Scatter / UI / Creature -->
    <div id="mode-aux-controls"
      class="hidden absolute top-3 left-1/2 -translate-x-1/2 z-30 basalt-slab px-3 py-1.5 rounded-sm flex flex-wrap items-center gap-3 text-xs border border-bronze shadow-2xl">
      <!-- Populated dynamically per view -->
    </div>

    <!-- Primary Stage Container -->
    <div id="stage" class="flex-1 w-full h-full relative overflow-hidden">
      <!-- Active View Renders Here -->
    </div>

    <!-- Compact Seamless Active Palette Dock (Shown in Mosaic, Scatter, UI Mockup, Creature) -->
    <div id="bottom-palette-dock" class="hidden h-14 w-full bg-basalt border-t border-chisel shrink-0 z-20 flex">
      <!-- Populated dynamically so users can always lock/edit/swap/pin colors in full-canvas views -->
    </div>
  </main>

  <!-- ===================================================================== -->
  <!-- 4. MANUAL COLOR PICKER POPOVER                                        -->
  <!-- ===================================================================== -->
  <div id="color-popover" class="hidden fixed z-50 w-72 basalt-slab border border-bronze p-3.5 text-xs rounded-sm shadow-2xl">
    <div class="flex items-center justify-between pb-2 mb-3 border-b border-chisel">
      <div class="flex items-center gap-2.5 min-w-0">
        <span id="popover-preview" class="w-6 h-6 border border-white/20 shrink-0"></span>
        <div class="min-w-0">
          <div class="font-semibold text-ash text-xs" id="popover-slot-label">Color 1</div>
          <div class="text-[11px] font-mono text-amber-300 truncate" id="popover-color-name"></div>
        </div>
      </div>
      <button id="popover-close" class="forge-btn px-2 py-0.5 text-xs font-mono">✕</button>
    </div>

    <!-- Native Color Input + Hex Input + Copy -->
    <div class="flex items-center gap-1.5 mb-3">
      <label class="relative w-9 h-8 carved-recess cursor-pointer shrink-0 overflow-hidden" title="System Color Picker">
        <input type="color" id="popover-native-picker" class="absolute -inset-2 w-14 h-14 cursor-pointer border-0 p-0" />
      </label>
      <input type="text" id="popover-hex-input" maxlength="7" placeholder="#RRGGBB"
        class="flex-1 carved-recess px-2.5 py-1.5 font-mono text-xs text-ash uppercase focus:outline-none focus:border-magma" />
      <button id="popover-copy-btn" class="forge-btn px-2.5 py-1.5 font-mono text-[11px]">
        Copy
      </button>
    </div>

    <!-- HSL Sliders -->
    <div class="space-y-2.5">
      <div>
        <div class="flex justify-between text-[11px] text-cinder mb-1">
          <span>Hue</span>
          <span class="text-ash font-mono" id="popover-h-val">180°</span>
        </div>
        <input type="range" id="popover-h" min="0" max="360" class="forge-slider"
          style="background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);" />
      </div>

      <div>
        <div class="flex justify-between text-[11px] text-cinder mb-1">
          <span>Saturation</span>
          <span class="text-ash font-mono" id="popover-s-val">70%</span>
        </div>
        <input type="range" id="popover-s" min="0" max="100" class="forge-slider" />
      </div>

      <div>
        <div class="flex justify-between text-[11px] text-cinder mb-1">
          <span>Lightness</span>
          <span class="text-ash font-mono" id="popover-l-val">50%</span>
        </div>
        <input type="range" id="popover-l" min="0" max="100" class="forge-slider" />
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 5. SAVE / LOAD SLIDE-OVER DRAWER                                      -->
  <!-- ===================================================================== -->
  <div id="drawer-backdrop" class="hidden fixed inset-0 bg-black/75 z-40"></div>
  <aside id="palettes-drawer"
    class="fixed top-0 right-0 h-full w-full max-w-md basalt-slab border-l border-bronze z-50 transform translate-x-full transition-transform duration-150 flex flex-col">
    <div class="px-4 py-3 border-b border-chisel flex items-center justify-between">
      <h2 class="font-semibold text-sm text-ash">Save / Load Palettes</h2>
      <button id="btn-close-drawer" class="forge-btn px-2.5 py-1 text-xs">Close</button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-5 text-xs">
      <!-- Save Current Palette -->
      <div class="carved-recess p-3.5 space-y-2.5">
        <div class="font-medium text-ash flex items-center justify-between">
          <span>Save Active Palette</span>
          <span class="text-[11px] font-mono text-amber-300" id="drawer-active-count">6 colors</span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="save-active-name" placeholder="Palette name..."
            class="flex-1 bg-basalt border border-chisel px-2.5 py-1.5 text-xs text-ash placeholder-cinder/50 focus:outline-none focus:border-magma" />
          <button id="btn-save-active" class="whitehot-btn px-3.5 py-1.5 text-xs rounded-sm shrink-0">
            Save
          </button>
        </div>
      </div>

      <!-- Save Pinned Palette -->
      <div class="carved-recess p-3.5 space-y-2.5">
        <div class="font-medium text-ash flex items-center justify-between">
          <span>Save Pinned Colors</span>
          <span class="text-[11px] font-mono text-amber-300" id="drawer-pinned-count">0 pinned</span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="save-pinned-name" placeholder="Pinned collection name..."
            class="flex-1 bg-basalt border border-chisel px-2.5 py-1.5 text-xs text-ash placeholder-cinder/50 focus:outline-none focus:border-magma" />
          <button id="btn-save-pinned" class="forge-btn px-3 py-1.5 text-xs shrink-0">
            Save Pinned
          </button>
        </div>
      </div>

      <!-- Export / Import -->
      <div class="carved-recess p-3.5 space-y-3">
        <div class="font-medium text-ash">Export & Import</div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-export-css" class="forge-btn py-2 px-3 font-mono text-[11px] text-center">
            Copy CSS Variables
          </button>
          <button id="btn-export-json" class="forge-btn py-2 px-3 font-mono text-[11px] text-center">
            Copy HEX JSON
          </button>
        </div>
        <div class="pt-2 border-t border-chisel space-y-2">
          <label class="block text-[11px] text-cinder">Paste HEX list or JSON to load:</label>
          <div class="flex gap-2">
            <input type="text" id="import-json-input" placeholder='["#181312", "#EA580C", "#FEF08A"]'
              class="flex-1 bg-basalt border border-chisel px-2.5 py-1.5 font-mono text-[11px] text-ash placeholder-cinder/50 focus:outline-none focus:border-magma" />
            <button id="btn-import-json" class="forge-btn px-3 py-1.5 text-xs">
              Import
            </button>
          </div>
        </div>
      </div>

      <!-- Saved Palettes List -->
      <div class="space-y-2">
        <div class="font-medium text-ash border-b border-chisel pb-1">Saved Palettes</div>
        <div id="saved-palettes-list" class="space-y-2"></div>
      </div>

      <!-- Preset Palettes -->
      <div class="space-y-2 pb-4">
        <div class="font-medium text-ash border-b border-chisel pb-1">Presets</div>
        <div id="starter-palettes-list" class="space-y-2"></div>
      </div>
    </div>
  </aside>

  <!-- Toast Notification -->
  <div id="toast"
    class="fixed bottom-5 right-5 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-150 basalt-slab border border-magma text-ash text-xs font-mono px-3.5 py-2 shadow-2xl flex items-center gap-2.5">
    <span id="toast-dot" class="w-3 h-3 border border-white/40 bg-amber-400"></span>
    <span id="toast-msg">Copied</span>
  </div>

  <script>
    /**
     * =========================================================================
     * 1. NAMED COLOR DATABASE (~320 DISTINCT PIGMENTS, MINERALS & X11 COLORS)
     *    Only displayed if a random or picked color is perceptually very close!
     * =========================================================================
     */
    const COLOR_DATABASE = [
      ["Obsidian", "#0B090A"], ["Basalt", "#181312"], ["Onyx", "#141414"],
      ["Charcoal", "#2B2F3A"], ["Graphite", "#383E4C"], ["Slate", "#475569"],
      ["Gunmetal", "#2A3439"], ["Iron", "#48494B"], ["Pewter", "#646B7A"],

    /**
     * =========================================================================
     * 2. PERCEPTUAL COLOR MATH (24-BIT RGB, HSL, CIELAB & CONDITIONAL NAMING)
     * =========================================================================
     */
    function normalizeHex(hex) {
      if (!hex) return "#000000";
      let h = String(hex).trim().replace(/^#/, "");
      if (h.length === 3) h = h.split("").map(c => c + c).join("");
      if (!/^[0-9A-Fa-f]{6}$/.test(h)) return null;
      return "#" + h.toUpperCase();
    }

    function hexToRgb(hex) {
      const clean = normalizeHex(hex) || "#000000";
      const num = parseInt(clean.slice(1), 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToHex(r, g, b) {
      const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
      return "#" + [clamp(r), clamp(g), clamp(b)]
        .map(v => v.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function hslToRgb(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r1 = 0, g1 = 0, b1 = 0;
      if (h < 60) { r1 = c; g1 = x; }
      else if (h < 120) { r1 = x; g1 = c; }
      else if (h < 180) { g1 = c; b1 = x; }
      else if (h < 240) { g1 = x; b1 = c; }
      else if (h < 300) { r1 = x; b1 = c; }
      else { r1 = c; b1 = x; }
      return {
        r: Math.round((r1 + m) * 255),
        g: Math.round((g1 + m) * 255),
        b: Math.round((b1 + m) * 255)
      };
    }

    function hslToHex(h, s, l) {
      const { r, g, b } = hslToRgb(h, s, l);
      return rgbToHex(r, g, b);
    }

    function hexToHsl(hex) {
      const { r, g, b } = hexToRgb(hex);
      return rgbToHsl(r, g, b);
    }

    function rgbToLab(r, g, b) {
      let sr = r / 255, sg = g / 255, sb = b / 255;
      sr = sr > 0.04045 ? Math.pow((sr + 0.055) / 1.055, 2.4) : sr / 12.92;
      sg = sg > 0.04045 ? Math.pow((sg + 0.055) / 1.055, 2.4) : sg / 12.92;
      sb = sb > 0.04045 ? Math.pow((sb + 0.055) / 1.055, 2.4) : sb / 12.92;

      let x = (sr * 0.4124564 + sg * 0.3575761 + sb * 0.1804375) / 0.95047;
      let y = (sr * 0.2126729 + sg * 0.7151522 + sb * 0.0721750) / 1.00000;
      let z = (sr * 0.0193339 + sg * 0.1191920 + sb * 0.9503041) / 1.08883;

      const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t) + (16 / 116);
      const fx = f(x), fy = f(y), fz = f(z);
      return { L: (116 * fy) - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
    }

    function hexToLab(hex) {
      const { r, g, b } = hexToRgb(hex);
      return rgbToLab(r, g, b);
    }

    function deltaE(lab1, lab2) {
      const dL = lab1.L - lab2.L;
      const da = lab1.a - lab2.a;
      const db = lab1.b - lab2.b;
      return Math.sqrt(dL * dL + da * da + db * db);
    }

    const PARSED_COLOR_DB = COLOR_DATABASE.map(([name, hex]) => ({
      name,
      hex: hex.toUpperCase(),
      lab: hexToLab(hex)
    }));

    /**
     * Conditional Closest Color Name:
     * - If ΔE <= 1.2: exact name
     * - If 1.2 < ΔE <= 6.5: "~ Name"
     * - If ΔE > 6.5: returns empty string "" (never force an inaccurate name)
     */
    const nameCache = new Map();
    function getClosestColorName(hex) {
      const key = normalizeHex(hex);
      if (nameCache.has(key)) return nameCache.get(key);
      const lab = hexToLab(key);
      let best = PARSED_COLOR_DB[0];
      let minD = Infinity;
      for (let i = 0; i < PARSED_COLOR_DB.length; i++) {
        const d = deltaE(lab, PARSED_COLOR_DB[i].lab);
        if (d < minD) {
          minD = d;
          best = PARSED_COLOR_DB[i];
          if (d === 0) break;
        }
      }
      let label = "";
      if (minD <= 1.2) {
        label = best.name;
      } else if (minD <= 6.5) {
        label = `~ ${best.name}`;
      }
      const res = { label, distance: minD };
      nameCache.set(key, res);
      return res;
    }

    function getRelativeLuminance(hex) {
      const { r, g, b } = hexToRgb(hex);
      const srgb = [r, g, b].map(v => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
    }

    function getContrastText(hex) {
      return getRelativeLuminance(hex) > 0.34 ? "#110D0C" : "#F5F2EB";
    }

    function hexWithAlpha(hex, alpha) {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    /**
     * =========================================================================
     * 3. AMBIENT MAGMA CAVERN EMBER & ANVIL STRIKE SPARK ENGINE
     * =========================================================================
     */
    const forgeFx = {
      canvas: null,
      ctx: null,
      embers: [],
      sparks: [],
      shockwaves: [],
      init() {
        this.canvas = document.getElementById("forge-fx-canvas");
        this.ctx = this.canvas.getContext("2d");
        this.resize();
        window.addEventListener("resize", () => this.resize());

        // Seed subtle rising cavern embers
        for (let i = 0; i < 18; i++) {
          this.embers.push(this.makeEmber(true));
        }
        requestAnimationFrame(() => this.loop());
      },
      resize() {
        if (!this.canvas) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      },
      makeEmber(randomY = false) {
        return {
          x: Math.random() * window.innerWidth,
          y: randomY ? Math.random() * window.innerHeight : window.innerHeight + 10,
          vx: (Math.random() - 0.5) * 0.35,
          vy: -(0.25 + Math.random() * 0.55),
          size: 1 + Math.random() * 1.8,
          alpha: 0.15 + Math.random() * 0.35,
          color: Math.random() > 0.4 ? "#FB923C" : "#FEF08A"
        };
      },
      triggerAnvilStrike(originX, originY) {
        // Spawn white-hot flying anvil sparks
        const count = 34;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.5 + Math.random() * 9.5;
          this.sparks.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.5,
            gravity: 0.22,
            life: 1.0,
            decay: 0.024 + Math.random() * 0.025,
            size: 1.4 + Math.random() * 2.2,
            color: i % 3 === 0 ? "#FFFFFF" : i % 2 === 0 ? "#FEF08A" : "#FB923C"
          });
        }
        this.shockwaves.push({
          x: originX,
          y: originY,
          radius: 8,
          maxRadius: 110,
          alpha: 0.75
        });

        // Brief white-hot seam flash on the main stage frame
        const frame = document.getElementById("main-frame");
        frame.classList.remove("strike-flash");
        void frame.offsetWidth;
        frame.classList.add("strike-flash");

        const btn = document.getElementById("btn-generate");
        btn.classList.add("anvil-struck");
        setTimeout(() => btn.classList.remove("anvil-struck"), 110);
      },
      loop() {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const H = this.canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Subtle rising background embers near bottom edge
        for (let i = 0; i < this.embers.length; i++) {
          const e = this.embers[i];
          e.x += e.vx;
          e.y += e.vy;
          if (e.y < H * 0.55) {
            e.alpha *= 0.985;
          }
          if (e.y < H * 0.3 || e.alpha < 0.02) {
            this.embers[i] = this.makeEmber(false);
            continue;
          }
          ctx.fillStyle = e.color;
          ctx.globalAlpha = e.alpha;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // Shockwave rings
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.radius += (sw.maxRadius - sw.radius) * 0.22;
          sw.alpha *= 0.84;
          if (sw.alpha < 0.03) {
            this.shockwaves.splice(i, 1);
            continue;
          }
          ctx.strokeStyle = "#FEF08A";
          ctx.lineWidth = 2;
          ctx.globalAlpha = sw.alpha;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.stroke();
        }

        // High-velocity Anvil Strike sparks
        for (let i = this.sparks.length - 1; i >= 0; i--) {
          const sp = this.sparks[i];
          const prevX = sp.x;
          const prevY = sp.y;
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.vy += sp.gravity;
          sp.vx *= 0.97;
          sp.life -= sp.decay;
          if (sp.life <= 0) {
            this.sparks.splice(i, 1);
            continue;
          }
          ctx.strokeStyle = sp.color;
          ctx.lineWidth = sp.size;
          ctx.globalAlpha = sp.life;
          ctx.beginPath();
          ctx.moveTo(prevX, prevY);
          ctx.lineTo(sp.x, sp.y);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(() => this.loop());
      }
    };

    /**
     * =========================================================================
     * 5. FULL-SPECTRUM CONTINUOUS 24-BIT RANDOM GENERATOR + ΔE GUARD
     * =========================================================================
     */
    function randomFullSpectrumHex() {
      // Mix uniform 24-bit RGB and full-spectrum continuous HSL so deep, vivid, and pastel tones all appear naturally
      if (Math.random() < 0.5) {
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);
        return rgbToHex(r, g, b);
      } else {
        const h = Math.random() * 360;
        const s = 5 + Math.random() * 95;
        const l = 6 + Math.random() * 88;
        return hslToHex(h, s, l);
      }
    }

    function getEffectiveThreshold(count) {
      const base = state.baseDeltaE;
      if (base <= 0) return 0;
      if (count <= 7) return base;
      return Math.max(8.0, base - (count - 7) * 0.75);
    }

    function generateDistinctColor(existingLabs, minThreshold) {
      let bestHex = randomFullSpectrumHex();
      if (minThreshold <= 0 || existingLabs.length === 0) return bestHex;

      let bestMinDist = -1;
      const maxAttempts = 60;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const candidateHex = randomFullSpectrumHex();
        const candidateLab = hexToLab(candidateHex);

        let minDist = Infinity;
        for (let i = 0; i < existingLabs.length; i++) {
          const d = deltaE(candidateLab, existingLabs[i]);
          if (d < minDist) minDist = d;
        }

        if (minDist >= minThreshold) {
          return candidateHex;
        }

        if (minDist > bestMinDist) {
          bestMinDist = minDist;
          bestHex = candidateHex;
        }
      }
      return bestHex;
    }

    function generatePalette(pushToHistory = true, triggerFx = true) {
      if (triggerFx) {
        const btn = document.getElementById("btn-generate");
        const rect = btn.getBoundingClientRect();
        forgeFx.triggerAnvilStrike(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      const count = state.slots.length;
      const threshold = getEffectiveThreshold(count);

      const acceptedLabs = state.slots
        .filter(s => s.locked)
        .map(s => hexToLab(s.hex));

      const nextSlots = state.slots.map(slot => {
        if (slot.locked) return { ...slot };
        const newHex = generateDistinctColor(acceptedLabs, threshold);
        acceptedLabs.push(hexToLab(newHex));
        return { ...slot, hex: newHex };
      });

      state.slots = nextSlots;
      if (pushToHistory) pushHistory();
      renderAll();
    }

    function setPaletteCount(newCount) {
      const clamped = Math.max(2, Math.min(24, newCount));
      if (clamped === state.slots.length) return;

      if (clamped < state.slots.length) {
        state.slots = state.slots.slice(0, clamped);
      } else {
        const threshold = getEffectiveThreshold(clamped);
        const acceptedLabs = state.slots.map(s => hexToLab(s.hex));
        while (state.slots.length < clamped) {
          const hex = generateDistinctColor(acceptedLabs, threshold);
          acceptedLabs.push(hexToLab(hex));
          state.slots.push({ id: nextSlotId(), hex, locked: false });
        }
      }

      if (state.editingSlotIndex !== null && state.editingSlotIndex >= clamped) {
        closePopover();
      }
      pushHistory();
      renderAll();
    }

    function rotateSlots() {
      if (state.slots.length < 2) return;
      const first = state.slots.shift();
      state.slots.push(first);
      pushHistory();
      renderAll();
    }

    function pushHistory() {
      const snapshot = state.slots.map(s => ({ hex: s.hex, locked: s.locked }));
      if (state.historyIndex < state.history.length - 1) {
        state.history = state.history.slice(0, state.historyIndex + 1);
      }
      state.history.push(snapshot);
      if (state.history.length > 35) {
        state.history.shift();
      } else {
        state.historyIndex++;
      }
      updateHistoryButtons();
    }

    function undo() {
      if (state.historyIndex <= 0) return;
      state.historyIndex--;
      restoreSnapshot(state.history[state.historyIndex]);
    }

    function redo() {
      if (state.historyIndex >= state.history.length - 1) return;
      state.historyIndex++;
      restoreSnapshot(state.history[state.historyIndex]);
    }

    function restoreSnapshot(snapshot) {
      closePopover();
      state.slots = snapshot.map((item, i) => ({
        id: state.slots[i]?.id || nextSlotId(),
        hex: item.hex,
        locked: item.locked
      }));
      updateHistoryButtons();
      renderAll();
    }

    function updateHistoryButtons() {
      document.getElementById("btn-undo").disabled = state.historyIndex <= 0;
      document.getElementById("btn-redo").disabled = state.historyIndex >= state.history.length - 1;
    }

    /**
     * =========================================================================
     * 6. SLOT ACTIONS: LOCK, PIN, SWAP, COPY, MANUAL PICKER
     * =========================================================================
     */
    function toggleLock(index) {
      if (!state.slots[index]) return;
      state.slots[index].locked = !state.slots[index].locked;
      pushHistory();
      renderAll();
    }

    function swapSlots(indexA, indexB) {
      if (
        indexA === indexB ||
        indexA < 0 || indexB < 0 ||
        indexA >= state.slots.length || indexB >= state.slots.length
      ) return;
      const temp = state.slots[indexA];
      state.slots[indexA] = state.slots[indexB];
      state.slots[indexB] = temp;
      if (state.editingSlotIndex === indexA) state.editingSlotIndex = indexB;
      else if (state.editingSlotIndex === indexB) state.editingSlotIndex = indexA;
      pushHistory();
      renderAll();
    }

    function updateSlotHex(index, newHex, recordHistory = true) {
      const normalized = normalizeHex(newHex);
      if (!normalized || !state.slots[index]) return;
      state.slots[index].hex = normalized;
      if (recordHistory) pushHistory();
      renderAll();
    }

    function pinColor(hex) {
      const normalized = normalizeHex(hex);
      if (!normalized) return;
      if (state.pinned.includes(normalized)) {
        showToast(`${normalized} already pinned`, normalized);
        return;
      }
      state.pinned.push(normalized);
      savePinnedToStorage();
      document.getElementById("pinned-tray").classList.remove("hidden");
      renderPinnedDock();
      showToast(`Pinned ${normalized}`, normalized);
    }

    function unpinColor(hex) {
      state.pinned = state.pinned.filter(h => h !== hex);
      savePinnedToStorage();
      renderPinnedDock();
    }

    function applyPinnedToSlot(hex) {
      let targetIdx = state.editingSlotIndex;
      if (targetIdx === null || targetIdx >= state.slots.length) {
        targetIdx = state.slots.findIndex(s => !s.locked);
      }
      if (targetIdx === -1) targetIdx = 0;
      updateSlotHex(targetIdx, hex, true);
      showToast(`Applied ${hex} to Color ${targetIdx + 1}`, hex);
    }

    function copyTextToClipboard(text, toastLabel) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
      } catch (e) {
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
      }
      document.body.removeChild(textarea);
      showToast(toastLabel || `Copied ${text}`, text.startsWith("#") ? text : "#FEF08A");
    }

    let toastTimer = null;
    function showToast(message, dotColor = "#FEF08A") {
      const toast = document.getElementById("toast");
      const msgEl = document.getElementById("toast-msg");
      const dotEl = document.getElementById("toast-dot");
      msgEl.textContent = message;
      dotEl.style.backgroundColor = normalizeHex(dotColor) || "#FEF08A";
      toast.classList.remove("opacity-0", "translate-y-2");
      toast.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        toast.classList.remove("opacity-100", "translate-y-0");
      }, 1700);
    }

    /**
     * =========================================================================
     * 7. MANUAL COLOR PICKER POPOVER
     * =========================================================================
     */
    function openColorPopover(index, anchorEl) {
      if (!state.slots[index]) return;
      state.editingSlotIndex = index;
      const popover = document.getElementById("color-popover");
      popover.classList.remove("hidden");
      syncPopoverValues();

      const rect = anchorEl
        ? anchorEl.getBoundingClientRect()
        : { left: window.innerWidth / 2 - 144, top: window.innerHeight / 2 - 130, bottom: window.innerHeight / 2, width: 0 };
      const popW = 288;
      const popH = 265;
      let left = rect.left + (rect.width ? rect.width / 2 - popW / 2 : 0);
      let top = rect.bottom + 8;

      if (left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
      if (left < 12) left = 12;
      if (top + popH > window.innerHeight - 12) {
        top = Math.max(12, rect.top - popH - 8);
      }

      popover.style.left = `${left}px`;
      popover.style.top = `${top}px`;
    }

    function closePopover() {
      state.editingSlotIndex = null;
      document.getElementById("color-popover").classList.add("hidden");
    }

    function syncPopoverValues() {
      const idx = state.editingSlotIndex;
      if (idx === null || !state.slots[idx]) return;
      const hex = state.slots[idx].hex;
      const hsl = hexToHsl(hex);
      const nameInfo = getClosestColorName(hex);

      document.getElementById("popover-preview").style.backgroundColor = hex;
      document.getElementById("popover-slot-label").textContent = `Color ${idx + 1}`;
      document.getElementById("popover-color-name").textContent = nameInfo.label || "";
      document.getElementById("popover-native-picker").value = hex;
      document.getElementById("popover-hex-input").value = hex;

      const hSlider = document.getElementById("popover-h");
      const sSlider = document.getElementById("popover-s");
      const lSlider = document.getElementById("popover-l");

      hSlider.value = hsl.h;
      sSlider.value = hsl.s;
      lSlider.value = hsl.l;

      document.getElementById("popover-h-val").textContent = `${hsl.h}°`;
      document.getElementById("popover-s-val").textContent = `${hsl.s}%`;
      document.getElementById("popover-l-val").textContent = `${hsl.l}%`;

      sSlider.style.background = `linear-gradient(to right, ${hslToHex(hsl.h, 0, hsl.l)}, ${hslToHex(hsl.h, 100, hsl.l)})`;
      lSlider.style.background = `linear-gradient(to right, #000000, ${hslToHex(hsl.h, hsl.s, 50)}, #FFFFFF)`;
    }

    function bindPopoverEvents() {
      document.getElementById("popover-close").addEventListener("click", closePopover);

      document.getElementById("popover-native-picker").addEventListener("input", e => {
        if (state.editingSlotIndex === null) return;
        updateSlotHex(state.editingSlotIndex, e.target.value, false);
        syncPopoverValues();
      });
      document.getElementById("popover-native-picker").addEventListener("change", () => pushHistory());

      document.getElementById("popover-hex-input").addEventListener("input", e => {
        if (state.editingSlotIndex === null) return;
        const norm = normalizeHex(e.target.value);
        if (norm) {
          updateSlotHex(state.editingSlotIndex, norm, false);
          syncPopoverValues();
        }
      });
      document.getElementById("popover-hex-input").addEventListener("change", () => pushHistory());

      document.getElementById("popover-copy-btn").addEventListener("click", () => {
        if (state.editingSlotIndex === null) return;
        copyTextToClipboard(state.slots[state.editingSlotIndex].hex);
      });

      const handleHslSlide = (commitHistory) => {
        if (state.editingSlotIndex === null) return;
        const h = parseInt(document.getElementById("popover-h").value, 10);
        const s = parseInt(document.getElementById("popover-s").value, 10);
        const l = parseInt(document.getElementById("popover-l").value, 10);
        updateSlotHex(state.editingSlotIndex, hslToHex(h, s, l), commitHistory);
        syncPopoverValues();
      };

      ["popover-h", "popover-s", "popover-l"].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener("input", () => handleHslSlide(false));
        el.addEventListener("change", () => handleHslSlide(true));
      });

      document.addEventListener("mousedown", e => {
        const pop = document.getElementById("color-popover");
        if (!pop.classList.contains("hidden") && !pop.contains(e.target) && !e.target.closest("[data-open-popover]")) {
          closePopover();
        }
      });
    }

    /**
     * =========================================================================
     * 8. DRAG & DROP AND COMPACT SWATCH CONTROLS
     * =========================================================================
     */
    function attachSlotDragHandlers(el, index) {
      el.setAttribute("draggable", "true");
      el.addEventListener("dragstart", e => {
        state.dragSourceIndex = index;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(index));
        el.style.opacity = "0.65";
      });
      el.addEventListener("dragend", () => {
        state.dragSourceIndex = null;
        el.style.opacity = "1";
        document.querySelectorAll(".drag-over-target").forEach(n => n.classList.remove("drag-over-target"));
      });
      el.addEventListener("dragover", e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (state.dragSourceIndex !== null && state.dragSourceIndex !== index) {
          el.classList.add("drag-over-target");
        }
      });
      el.addEventListener("dragleave", () => {
        el.classList.remove("drag-over-target");
      });
      el.addEventListener("drop", e => {
        e.preventDefault();
        el.classList.remove("drag-over-target");
        const pinnedHex = e.dataTransfer.getData("text/pinned-hex");
        if (pinnedHex) {
          updateSlotHex(index, pinnedHex, true);
          return;
        }
        const src = state.dragSourceIndex !== null ? state.dragSourceIndex : parseInt(e.dataTransfer.getData("text/plain"), 10);
        if (!isNaN(src) && src !== index) {
          swapSlots(src, index);
        }
      });
    }

    function createSlotControlsBar(index, compact = false) {
      const slot = state.slots[index];
      const isPinned = state.pinned.includes(slot.hex);
      const bar = document.createElement("div");
      bar.className = "inline-flex items-center gap-0.5 bg-basalt/90 border border-chisel p-0.5 rounded-sm shadow-lg";

      const makeBtn = (title, html, onClick, active = false) => {
        const b = document.createElement("button");
        b.type = "button";
        b.title = title;
        b.className = `px-1.5 py-1 text-[10px] font-mono transition cursor-pointer rounded-sm ${
          active
            ? "bg-magma text-basalt font-bold"
            : "bg-slab text-ash hover:bg-chisel hover:text-whitehot"
        }`;
        b.innerHTML = html;
        b.onclick = e => {
          e.stopPropagation();
          onClick(e, b);
        };
        return b;
      };

      if (!compact && index > 0) {
        bar.appendChild(makeBtn("Swap Left", "&lt;", () => swapSlots(index, index - 1)));
      }

      const lockIcon = slot.locked
        ? `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H5v12h14V10h-2V7a5 5 0 0 0-5-5zm-3 5a3 3 0 1 1 6 0v3H9V7z"/></svg>`
        : `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>`;
      bar.appendChild(makeBtn(slot.locked ? "Unlock" : "Lock", lockIcon, () => toggleLock(index), slot.locked));

      const pickIcon = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
      const pickBtn = makeBtn("Edit Color", pickIcon, (e, btn) => openColorPopover(index, btn));
      pickBtn.setAttribute("data-open-popover", "true");
      bar.appendChild(pickBtn);

      const pinIcon = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="${isPinned ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M16 3H8v6l-2 4v2h5v6h2v-6h5v-2l-2-4V3z"/></svg>`;
      bar.appendChild(makeBtn(isPinned ? "Pinned" : "Pin Color", pinIcon, () => pinColor(slot.hex), isPinned));

      if (!compact && index < state.slots.length - 1) {
        bar.appendChild(makeBtn("Swap Right", "&gt;", () => swapSlots(index, index + 1)));
      }

      return bar;
    }

    /**
     * Helper for label overlay visibility based on state.labelMode ('hover' | 'always' | 'off')
     */
    function getOverlayVisibilityClass(locked = false) {
      if (state.labelMode === "off") return "opacity-0 pointer-events-none";
      if (state.labelMode === "always" || locked) return "opacity-100";
      return "opacity-0 group-hover:opacity-100 focus-within:opacity-100";
    }

    /**
     * =========================================================================
     * 9. VIEW MODE 1: GRID (SEAMLESS GAPLESS DEFAULT OR FRAMED)
     * =========================================================================
     */
    function renderGridView(container) {
      const n = state.slots.length;
      const rect = container.getBoundingClientRect();
      const vw = Math.max(320, rect.width);
      const vh = Math.max(300, rect.height);

      const gap = state.seamless ? 0 : 12;
      const pad = state.seamless ? 0 : 16;
      const minTile = 160;

      const aspect = vw / vh;
      let cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
      if (n <= 4) cols = Math.min(n, vw < 520 ? 2 : n);
      const rows = Math.ceil(n / cols);

      const fitW = Math.floor((vw - pad * 2 - gap * (cols - 1)) / cols);
      const fitH = Math.floor((vh - pad * 2 - gap * (rows - 1)) / rows);

      const colW = Math.max(minTile, fitW);
      const rowH = Math.max(minTile, fitH);

      const totalGridW = cols * colW + (cols - 1) * gap + pad * 2;
      const totalGridH = rows * rowH + (rows - 1) * gap + pad * 2;
      const needsPan = totalGridW > vw + 2 || totalGridH > vh + 2;

      const viewport = document.createElement("div");
      viewport.className = `w-full h-full relative overflow-auto ${needsPan ? "pan-grab" : "flex items-center justify-center"}`;

      const grid = document.createElement("div");
      grid.style.display = "grid";
      if (state.seamless && !needsPan) {
        grid.style.width = "100%";
        grid.style.height = "100%";
        grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        grid.style.gridAutoRows = `1fr`;
      } else {
        grid.style.gridTemplateColumns = `repeat(${cols}, ${colW}px)`;
        grid.style.gridAutoRows = `${rowH}px`;
        grid.style.gap = `${gap}px`;
        grid.style.padding = `${pad}px`;
      }

      state.slots.forEach((slot, idx) => {
        const fg = getContrastText(slot.hex);
        const nameInfo = getClosestColorName(slot.hex);

        // If the last row has fewer items in Seamless mode, span remaining columns so no background gap shows
        const isLast = idx === n - 1;
        const remainder = n % cols;
        const spanCols = (isLast && remainder !== 0) ? (cols - remainder + 1) : 1;

        const card = document.createElement("div");
        if (spanCols > 1) {
          card.style.gridColumn = `span ${spanCols}`;
        }
        card.style.backgroundColor = slot.hex;
        card.style.color = fg;
        card.className = `p-3 flex flex-col justify-between relative group transition-opacity ${
          state.seamless ? "" : "border-2 border-chisel shadow-lg"
        }`;
        attachSlotDragHandlers(card, idx);

        const visClass = getOverlayVisibilityClass(slot.locked);

        // Top Lock Indicator
        const top = document.createElement("div");
        top.className = `flex items-center justify-between text-[10px] font-mono transition-opacity duration-150 ${visClass}`;
        top.innerHTML = `
          <span class="opacity-70 font-semibold">${idx + 1}</span>
          ${slot.locked ? `<span class="bg-basalt/80 text-whitehot px-1.5 py-0.5 rounded-sm font-semibold">Locked</span>` : `<span></span>`}
        `;

        // Center HEX + Conditional Close Name
        const mid = document.createElement("div");
        mid.className = `my-auto flex flex-col items-center text-center transition-opacity duration-150 ${visClass}`;

        const hexBtn = document.createElement("button");
        hexBtn.className = "font-mono font-bold text-base sm:text-lg tracking-wider uppercase hover:underline cursor-pointer";
        hexBtn.textContent = slot.hex;
        hexBtn.title = "Click to copy HEX";
        hexBtn.onclick = e => { e.stopPropagation(); copyTextToClipboard(slot.hex); };
        mid.appendChild(hexBtn);

        if (nameInfo.label) {
          const nameEl = document.createElement("div");
          nameEl.className = "text-xs font-medium opacity-85 mt-0.5 truncate max-w-full px-2";
          nameEl.textContent = nameInfo.label;
          mid.appendChild(nameEl);
        }

        // Bottom Controls
        const bottom = document.createElement("div");
        bottom.className = `flex justify-center transition-opacity duration-150 ${visClass}`;
        bottom.appendChild(createSlotControlsBar(idx, false));

        card.appendChild(top);
        card.appendChild(mid);
        card.appendChild(bottom);
        grid.appendChild(card);
      });

      viewport.appendChild(grid);
      container.appendChild(viewport);

      if (needsPan) {
        enableDragPanning(viewport);
      }
    }

    function enableDragPanning(viewport) {
      let isPanning = false;
      let startX = 0, startY = 0, scrollLeft = 0, scrollTop = 0;

      viewport.addEventListener("mousedown", e => {
        if (e.target.closest("button") || e.target.closest("[draggable='true']")) return;
        isPanning = true;
        viewport.classList.add("pan-grabbing");
        startX = e.pageX - viewport.offsetLeft;
        startY = e.pageY - viewport.offsetTop;
        scrollLeft = viewport.scrollLeft;
        scrollTop = viewport.scrollTop;
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        viewport.classList.remove("pan-grabbing");
      });
      viewport.addEventListener("mousemove", e => {
        if (!isPanning) return;
        e.preventDefault();
        const x = e.pageX - viewport.offsetLeft;
        const y = e.pageY - viewport.offsetTop;
        viewport.scrollLeft = scrollLeft - (x - startX);
        viewport.scrollTop = scrollTop - (y - startY);
      });
    }

    /**
     * =========================================================================
     * 10. VIEW MODE 2: MOSAIC (HIGH-DENSITY SHARD CLUTTER VISUALIZER)
     *     Renders 80 to 500 Voronoi/jittered crystal shards across the screen
     *     with zero text boxes and equal color distribution.
     * =========================================================================
     */
    function seededRng(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => (s = (s * 16807) % 2147483647) / 2147483647;
    }

    function clipPolygonHalfPlane(poly, nx, ny, c) {
      const out = [];
      const len = poly.length;
      if (len === 0) return out;
      for (let i = 0; i < len; i++) {
        const p1 = poly[i];
        const p2 = poly[(i + 1) % len];
        const d1 = p1[0] * nx + p1[1] * ny - c;
        const d2 = p2[0] * nx + p2[1] * ny - c;
        if (d1 <= 0) out.push(p1);
        if ((d1 < 0 && d2 > 0) || (d1 > 0 && d2 < 0)) {
          const t = d1 / (d1 - d2);
          out.push([
            p1[0] + t * (p2[0] - p1[0]),
            p1[1] + t * (p2[1] - p1[1])
          ]);
        }
      }
      return out;
    }

    function renderMosaicView(container) {
      const canvas = document.createElement("canvas");
      canvas.className = "w-full h-full block cursor-pointer";
      container.appendChild(canvas);

      const rect = container.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = Math.max(320, rect.width);
      const H = Math.max(260, rect.height);
      canvas.width = W * dpr;
      canvas.height = H * dpr;

      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const n = state.slots.length;
      const totalCells = state.mosaicCount;
      const rng = seededRng(state.mosaicSeed + n * 19 + totalCells);

      // Generate stratified jittered Voronoi seed points across the viewport
      const aspect = W / H;
      const cols = Math.max(4, Math.round(Math.sqrt(totalCells * aspect)));
      const rows = Math.max(4, Math.round(totalCells / cols));
      const cellW = W / cols;
      const cellH = H / rows;

      // Optional cluster centers for color grouping
      const clusterStrength = state.mosaicCluster / 100;
      const anchors = [];
      for (let i = 0; i < n; i++) {
        anchors.push({
          x: rng() * W,
          y: rng() * H,
          slotIndex: i
        });
      }

      const sites = [];
      let idxCounter = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const sx = (c + 0.15 + rng() * 0.7) * cellW;
          const sy = (r + 0.15 + rng() * 0.7) * cellH;
          sites.push({
            r, c,
            x: sx,
            y: sy,
            slotIndex: idxCounter % n
          });
          idxCounter++;
        }
      }

      // Shuffle balanced slot assignments, blending with spatial cluster preference if clusterStrength > 0
      for (let i = sites.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const tmp = sites[i].slotIndex;
        sites[i].slotIndex = sites[j].slotIndex;
        sites[j].slotIndex = tmp;
      }

      if (clusterStrength > 0) {
        sites.forEach(s => {
          if (rng() < clusterStrength) {
            let bestA = anchors[0];
            let minD = Infinity;
            for (let k = 0; k < anchors.length; k++) {
              const d = Math.hypot(s.x - anchors[k].x, s.y - anchors[k].y) + (rng() - 0.5) * 140;
              if (d < minD) {
                minD = d;
                bestA = anchors[k];
              }
            }
            s.slotIndex = bestA.slotIndex;
          }
        });
      }

      // 2D Grid lookup for fast local Voronoi cell clipping
      const gridMap = Array.from({ length: rows }, () => Array(cols).fill(null));
      sites.forEach(s => { gridMap[s.r][s.c] = s; });

      const renderedPolys = [];

      sites.forEach(site => {
        const pad = Math.max(cellW, cellH) * 2.4;
        let poly = [
          [Math.max(0, site.x - pad), Math.max(0, site.y - pad)],
          [Math.min(W, site.x + pad), Math.max(0, site.y - pad)],
          [Math.min(W, site.x + pad), Math.min(H, site.y + pad)],
          [Math.max(0, site.x - pad), Math.min(H, site.y + pad)]
        ];

        const rMin = Math.max(0, site.r - 2);
        const rMax = Math.min(rows - 1, site.r + 2);
        const cMin = Math.max(0, site.c - 2);
        const cMax = Math.min(cols - 1, site.c + 2);

        for (let nr = rMin; nr <= rMax; nr++) {
          for (let nc = cMin; nc <= cMax; nc++) {
            if (nr === site.r && nc === site.c) continue;
            const other = gridMap[nr][nc];
            if (!other) continue;
            const nx = other.x - site.x;
            const ny = other.y - site.y;
            const midX = (site.x + other.x) * 0.5;
            const midY = (site.y + other.y) * 0.5;
            const c = midX * nx + midY * ny;
            poly = clipPolygonHalfPlane(poly, nx, ny, c);
            if (poly.length === 0) break;
          }
          if (poly.length === 0) break;
        }

        if (poly.length < 3) return;
        const hex = state.slots[site.slotIndex]?.hex || "#000000";

        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for (let i = 1; i < poly.length; i++) {
          ctx.lineTo(poly[i][0], poly[i][1]);
        }
        ctx.closePath();
        ctx.fillStyle = hex;
        ctx.fill();

        // In Seamless mode, stroke with the exact same color (0.6px) to eliminate canvas anti-aliasing seams.
        // In Framed mode, stroke with dark basalt mortar lines.
        if (state.seamless) {
          ctx.strokeStyle = hex;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        } else {
          ctx.strokeStyle = "#0B090A";
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }

        renderedPolys.push({ site, poly });
      });

      // Clicking any shard highlights/opens its slot in the bottom palette dock
      canvas.addEventListener("click", e => {
        const b = canvas.getBoundingClientRect();

    /**
     * =========================================================================
     * 12. VIEW MODE 4: SCATTER (HIGH-DENSITY DOT CLUTTER VISUALIZER)
     *     Renders 150 to 800 scattered dots across the whole screen using all N
     *     colors in equal proportion, with zero text boxes.
     * =========================================================================
     */
    function renderScatteredDotsView(container) {
      const canvas = document.createElement("canvas");
      canvas.className = "w-full h-full block cursor-pointer";
      container.appendChild(canvas);

      const rect = container.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = Math.max(320, rect.width);
      const H = Math.max(260, rect.height);
      canvas.width = W * dpr;
      canvas.height = H * dpr;

      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const bgMap = {
        dark: "#0B090A",
        gray: "#222222",
        light: "#F5F5F4",
        slot1: state.slots[0]?.hex || "#0B090A"
      };
      ctx.fillStyle = bgMap[state.dotsBackdrop] || bgMap.dark;
      ctx.fillRect(0, 0, W, H);

      const n = state.slots.length;
      const totalDots = state.dotsCount;
      const rng = seededRng(state.dotsSeed + n * 31 + totalDots);

      const dots = [];
      const baseArea = (W * H) / totalDots;
      const baseRadius = Math.max(3.5, Math.min(22, Math.sqrt(baseArea) * 0.34));

      for (let i = 0; i < totalDots; i++) {
        const slotIndex = i % n;
        const r = state.dotsVariedSize
          ? baseRadius * (0.45 + rng() * 1.15)
          : baseRadius;
        const x = r + rng() * (W - r * 2);
        const y = r + rng() * (H - r * 2);
        dots.push({ x, y, r, slotIndex });
      }

      // Shuffle draw order so no single color sits exclusively on top
      for (let i = dots.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const tmp = dots[i];
        dots[i] = dots[j];
        dots[j] = tmp;
      }

      dots.forEach(d => {
        const hex = state.slots[d.slotIndex]?.hex || "#FFFFFF";
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = hex;
        ctx.fill();

        if (!state.seamless) {
          ctx.strokeStyle = "rgba(0,0,0,0.45)";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      });

      // Clicking a dot highlights its color in the bottom dock
      canvas.addEventListener("click", e => {
        const b = canvas.getBoundingClientRect();
        const mx = e.clientX - b.left;
        const my = e.clientY - b.top;
        for (let i = dots.length - 1; i >= 0; i--) {
          const d = dots[i];
          if (Math.hypot(d.x - mx, d.y - my) <= d.r + 3) {
            highlightBottomSlot(d.slotIndex);
            break;
          }
        }
      });
    }

      state.slots.forEach((slot, idx) => {
        const hsl = hexToHsl(slot.hex);
        const fg = getContrastText(slot.hex);
        const nameInfo = getClosestColorName(slot.hex);

        const topTint = hslToHex(hsl.h, hsl.s, 96);
        const botShade = hslToHex(hsl.h, hsl.s, 5);
        const stopPct = Math.max(4, Math.min(96, 100 - hsl.l));

        const col = document.createElement("div");
        col.style.flex = "1 0 140px";
        col.style.minWidth = "140px";
        col.style.background = `linear-gradient(to bottom, ${topTint} 0%, ${slot.hex} ${stopPct}%, ${botShade} 100%)`;

          state.seamless ? "" : "border-2 border-chisel shadow-lg"
        }`;
        col.title = "Click or drag vertically to adjust lightness";

        const pickLightnessFromEvent = (e, commitHistory) => {
          const rect = col.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
          const pickedL = Math.round(96 - ratio * 91);
          const newHex = hslToHex(hsl.h, hsl.s, pickedL);
          updateSlotHex(idx, newHex, commitHistory);
        };

        let draggingRamp = false;
        col.addEventListener("mousedown", e => {
          if (e.target.closest("button") || e.target.closest("[data-no-scrub]")) return;
          draggingRamp = true;
          pickLightnessFromEvent(e, false);
        });
        window.addEventListener("mousemove", e => {
          if (!draggingRamp) return;
          pickLightnessFromEvent(e, false);
        });
        window.addEventListener("mouseup", e => {
          if (!draggingRamp) return;
          draggingRamp = false;
          pickLightnessFromEvent(e, true);
        });

        // Subtle Arrow Marker showing where the generated/selected color lies on the gradient
        const marker = document.createElement("div");
        marker.style.top = `${stopPct}%`;

        `;
        col.appendChild(marker);

        const visClass = getOverlayVisibilityClass(slot.locked);

        // Top Readout

        attachSlotDragHandlers(topPlate, idx);

        hexBtn.textContent = slot.hex;
        hexBtn.onclick = e => { e.stopPropagation(); copyTextToClipboard(slot.hex); };
        topPlate.appendChild(hexBtn);

        if (nameInfo.label) {
          const nameEl = document.createElement("div");
